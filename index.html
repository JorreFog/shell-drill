<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shell Drill — learn the Linux terminal by typing in it</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#0A0E14;
  --panel:#111823;
  --panel-2:#161F2C;
  --line:#22303F;
  --bone:#D9E0E8;
  --dim:#7A8B9C;
  --amber:#FFB454;
  --cyan:#5CCFE6;
  --rose:#F07178;
  --lime:#A7D96C;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"Space Grotesk",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--void);color:var(--bone);
  font-family:var(--mono);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
/* faint CRT wash — decorative only */
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:99;
  background:repeating-linear-gradient(to bottom,rgba(255,255,255,.014) 0 1px,transparent 1px 3px);
  mix-blend-mode:screen;
}
a{color:var(--cyan)}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* ---------- layout ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 80px}
header.top{
  display:flex;flex-wrap:wrap;gap:14px;align-items:baseline;
  padding:22px 0 16px;border-bottom:1px solid var(--line);margin-bottom:22px;
}
.brand{font-weight:700;font-size:19px;letter-spacing:.16em;text-transform:uppercase}
.brand b{color:var(--amber);font-weight:700}
.tagline{color:var(--dim);font-size:12.5px;letter-spacing:.04em}
.top .spacer{flex:1}

.grid{display:grid;grid-template-columns:230px 1fr;gap:26px;align-items:start}

/* ---------- sidebar ---------- */
aside{position:sticky;top:20px}
.sect-label{
  font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  margin:0 0 10px;font-weight:500;
}
.mod{
  display:flex;gap:9px;align-items:center;width:100%;text-align:left;
  background:none;border:0;border-left:2px solid transparent;
  color:var(--dim);padding:7px 10px;cursor:pointer;font-size:12.5px;
  transition:color .12s,border-color .12s,background .12s;
}
.mod:hover{color:var(--bone);background:rgba(255,255,255,.03)}
.mod[aria-current="true"]{color:var(--amber);border-left-color:var(--amber);background:rgba(255,180,84,.06)}
.mod .n{opacity:.65;font-variant-numeric:tabular-nums}
.mod .done{margin-left:auto;font-size:11px;color:var(--lime);opacity:.9}
.mod.locked{opacity:.55}

.stats{margin-top:26px;border-top:1px solid var(--line);padding-top:16px;font-size:12px}
.stat{display:flex;justify-content:space-between;padding:3px 10px;color:var(--dim)}
.stat b{color:var(--bone);font-weight:500;font-variant-numeric:tabular-nums}
.reset{margin:14px 0 0 10px;background:none;border:0;color:var(--dim);font-size:11px;
  text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0}
.reset:hover{color:var(--rose)}

/* ---------- distro picker ---------- */
.distro{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.distro .lbl{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-right:4px}
.pill{
  background:var(--panel);border:1px solid var(--line);color:var(--dim);
  padding:5px 11px;border-radius:2px;cursor:pointer;font-size:12px;letter-spacing:.02em;
  transition:all .12s;
}
.pill:hover{color:var(--bone);border-color:#33475c}
.pill[aria-pressed="true"]{background:rgba(92,207,230,.1);border-color:var(--cyan);color:var(--cyan)}
.pill small{opacity:.6;margin-left:5px}

/* ---------- task brief ---------- */
.brief{
  border:1px solid var(--line);border-left:3px solid var(--amber);
  background:linear-gradient(180deg,var(--panel-2),var(--panel));
  padding:20px 24px;margin-bottom:16px;
}
.brief .meta{
  display:flex;gap:14px;flex-wrap:wrap;align-items:center;
  font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-bottom:11px;
}
.brief .meta .idx{color:var(--amber)}
.brief h1{
  font-family:var(--sans);font-size:clamp(19px,2.6vw,26px);font-weight:500;
  line-height:1.28;margin:0;letter-spacing:-.01em;
}
.brief .ctx{font-family:var(--sans);color:var(--dim);font-size:14px;margin:9px 0 0}
.brief code{background:rgba(92,207,230,.1);color:var(--cyan);padding:1px 5px;font-size:.92em}
.actions{display:flex;gap:8px;margin-top:15px;flex-wrap:wrap}
.ghost{
  background:none;border:1px solid var(--line);color:var(--dim);
  padding:5px 12px;font-size:11.5px;cursor:pointer;border-radius:2px;transition:all .12s;
}
.ghost:hover{border-color:var(--amber);color:var(--amber)}
.hintbox{
  margin-top:13px;border-left:2px solid var(--cyan);background:rgba(92,207,230,.06);
  padding:9px 14px;font-size:13px;color:#B8CBD8;font-family:var(--sans);
}
.hintbox b{color:var(--cyan);font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;display:block;margin-bottom:3px}

/* ---------- terminal ---------- */
.term{
  background:#080B10;border:1px solid var(--line);border-radius:3px;
  box-shadow:0 0 0 1px rgba(0,0,0,.4),0 18px 50px -30px #000;
}
.bar{
  display:flex;align-items:center;gap:8px;padding:8px 13px;
  border-bottom:1px solid var(--line);background:var(--panel);
}
.dot{width:9px;height:9px;border-radius:50%;background:#2C3A4A}
.dot.r{background:#54303a}.dot.y{background:#5a4830}.dot.g{background:#38512f}
.bar .title{margin-left:6px;font-size:11.5px;color:var(--dim);letter-spacing:.05em}
.screen{
  padding:14px 16px;min-height:270px;max-height:44vh;overflow-y:auto;
  font-size:13.5px;line-height:1.62;cursor:text;
}
.screen::-webkit-scrollbar{width:9px}
.screen::-webkit-scrollbar-thumb{background:#22303F;border-radius:5px}
.ln{white-space:pre-wrap;word-break:break-word}
.ln.cmd .p{color:var(--lime)}
.ln.cmd .h{color:var(--cyan)}
.ln.cmd .path{color:var(--amber)}
.ln.ok{color:var(--lime)}
.ln.err{color:var(--rose)}
.ln.note{color:var(--dim)}
.ln.sys{color:var(--cyan)}
.inputline{display:flex;align-items:baseline;gap:8px;padding:2px 16px 15px}
.ps1{color:var(--lime);white-space:nowrap;font-size:13.5px}
.ps1 .h{color:var(--cyan)}
.ps1 .path{color:var(--amber)}
/* every terminal input, not just the drill's — the lab terminal has its own id */
.inputline input{
  flex:1;background:none;border:0;color:var(--bone);font-family:var(--mono);
  font-size:13.5px;padding:0;caret-color:var(--amber);
}
.inputline input:focus{outline:none}
.inputline input::placeholder{color:#3E4C5C}

/* ---------- breakdown (signature) ---------- */
.breakdown{
  margin-top:16px;border:1px solid var(--line);background:var(--panel);
  border-top:2px solid var(--lime);padding:17px 20px;
  animation:rise .28s ease-out;
}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.breakdown h2{
  font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--lime);
  margin:0 0 13px;font-weight:500;
}
.tok{display:flex;gap:14px;padding:6px 0;border-bottom:1px dashed rgba(34,48,63,.8);align-items:baseline}
.tok:last-child{border-bottom:0}
.tok .k{color:var(--amber);min-width:110px;font-weight:500;font-size:13px}
.tok .v{color:#A9B8C6;font-family:var(--sans);font-size:13.5px}
.nextbtn{
  margin-top:15px;background:var(--lime);color:#0A0E14;border:0;font-weight:700;
  padding:9px 20px;cursor:pointer;border-radius:2px;font-size:12.5px;letter-spacing:.05em;
}
.nextbtn:hover{filter:brightness(1.1)}

.done-card{border-top-color:var(--amber);text-align:center;font-family:var(--sans)}
.done-card .big{font-size:30px;color:var(--amber);font-family:var(--mono);font-weight:700}

/* ---------- mode toggle ---------- */
.modes{display:flex;gap:6px;margin-left:4px}
.modes .pill[aria-pressed="true"]{background:rgba(255,180,84,.12);border-color:var(--amber);color:var(--amber)}

/* ---------- quiz ---------- */
.qopts{display:flex;flex-direction:column;gap:9px}
.qopt{
  display:flex;gap:13px;align-items:flex-start;text-align:left;width:100%;
  background:var(--panel);border:1px solid var(--line);color:var(--bone);
  padding:14px 17px;border-radius:3px;cursor:pointer;font-size:14px;line-height:1.5;
  transition:border-color .12s,background .12s;
}
.qopt:hover{border-color:#3B5063;background:var(--panel-2)}
.qopt .txt{font-family:var(--sans)}
.qopt .txt code{font-family:var(--mono);font-size:12.5px;background:rgba(92,207,230,.1);color:var(--cyan);padding:1px 5px}
.qopt .box{
  width:16px;height:16px;flex-shrink:0;margin-top:2px;border:1px solid var(--dim);
  border-radius:2px;position:relative;
}
.qopt.on{border-color:var(--cyan);background:rgba(92,207,230,.07)}
.qopt.on .box{background:var(--cyan);border-color:var(--cyan)}
.qopt.on .box::after{content:"";position:absolute;left:5px;top:1px;width:4px;height:9px;
  border:solid #0A0E14;border-width:0 2px 2px 0;transform:rotate(45deg)}
.qopt.hit{border-color:var(--lime);background:rgba(167,217,108,.09)}
.qopt.hit .box{background:var(--lime);border-color:var(--lime)}
.qopt.hit .box::after{content:"";position:absolute;left:5px;top:1px;width:4px;height:9px;
  border:solid #0A0E14;border-width:0 2px 2px 0;transform:rotate(45deg)}
.qopt.missed{border-color:var(--amber);background:rgba(255,180,84,.08)}
.qopt.missed .box::after{content:"";position:absolute;inset:3px;background:var(--amber);border-radius:1px}
.qopt.wrong{border-color:var(--rose);background:rgba(240,113,120,.08)}
.qopt.wrong .box{border-color:var(--rose)}
.qopt.wrong .box::after{content:"×";position:absolute;left:3px;top:-3px;color:var(--rose);font-size:14px}
.qopt.hit::after,.qopt.missed::after,.qopt.wrong::after{
  margin-left:auto;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-family:var(--mono);white-space:nowrap}
.qopt.hit::after{content:"correct";color:var(--lime)}
.qopt.missed::after{content:"missed";color:var(--amber)}
.qopt.wrong::after{content:"not correct";color:var(--rose)}

/* ---------- module guide ---------- */
.guide{
  border:1px solid var(--line);background:var(--panel);padding:0;margin-bottom:16px;
}
.guide summary{
  cursor:pointer;padding:11px 18px;font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--cyan);list-style:none;user-select:none;
}
.guide summary::-webkit-details-marker{display:none}
.guide summary::before{content:"▸ ";display:inline-block;transition:transform .15s}
.guide[open] summary::before{content:"▾ "}
.guide .body{padding:0 18px 16px;font-family:var(--sans);font-size:13.5px;color:#A9B8C6;line-height:1.62}
.guide .body p{margin:0 0 10px}
.guide .body code{font-family:var(--mono);background:rgba(255,180,84,.1);color:var(--amber);padding:1px 5px;font-size:12.5px}

/* ---------- cheatsheet drawer ---------- */
.refbtn{
  background:var(--panel);border:1px solid var(--cyan);color:var(--cyan);
  padding:6px 14px;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;
  cursor:pointer;border-radius:2px;
}
.refbtn:hover{background:rgba(92,207,230,.12)}
.scrim{
  position:fixed;inset:0;background:rgba(4,7,11,.72);z-index:100;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);z-index:101;
  background:var(--panel);border-left:1px solid var(--line);
  transform:translateX(100%);transition:transform .24s ease-out;
  display:flex;flex-direction:column;
}
.drawer.open{transform:none}
.drawer .dhead{padding:18px 22px 12px;border-bottom:1px solid var(--line)}
.drawer h2{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--amber);margin:0 0 3px;font-weight:500}
.drawer .sub{font-size:12px;color:var(--dim);font-family:var(--sans)}
.closex{position:absolute;top:14px;right:18px;background:none;border:0;color:var(--dim);font-size:20px;cursor:pointer;line-height:1}
.closex:hover{color:var(--rose)}
#refsearch{
  width:100%;margin-top:13px;background:#080B10;border:1px solid var(--line);
  color:var(--bone);font-family:var(--mono);font-size:13px;padding:8px 11px;border-radius:2px;
}
#refsearch:focus{outline:none;border-color:var(--cyan)}
.reflist{overflow-y:auto;padding:6px 22px 40px;flex:1}
.reflist::-webkit-scrollbar{width:9px}
.reflist::-webkit-scrollbar-thumb{background:#22303F;border-radius:5px}
.refgroup{margin-top:20px}
.refgroup h3{
  font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  margin:0 0 8px;font-weight:500;border-bottom:1px solid var(--line);padding-bottom:6px;
}
.refrow{display:grid;grid-template-columns:minmax(120px,38%) 1fr;gap:12px;padding:5px 0;align-items:baseline}
.refrow code{color:var(--amber);font-size:12.5px;word-break:break-word}
.refrow span{color:#9FB0BF;font-family:var(--sans);font-size:13px}
.refempty{color:var(--dim);font-family:var(--sans);padding:20px 0}
@media(max-width:560px){.refrow{grid-template-columns:1fr;gap:1px;padding:8px 0}}

@media(max-width:820px){
  .grid{grid-template-columns:1fr}
  /* grid and flex children default to min-width:auto, which lets the nav row
     stretch the page instead of scrolling inside itself */
  .grid>*{min-width:0}
  aside{position:static;border-bottom:1px solid var(--line);padding-bottom:14px;min-width:0}
  .modlist{display:flex;overflow-x:auto;gap:2px;padding-bottom:4px;min-width:0;max-width:100%}
  .mod{border-left:0;border-bottom:2px solid transparent;white-space:nowrap;flex-shrink:0;
       max-width:70vw;overflow:hidden}
  .mod>span:nth-child(2){overflow:hidden;text-overflow:ellipsis}
  .mod[aria-current="true"]{border-left-color:transparent;border-bottom-color:var(--amber)}
  .stats{display:flex;gap:16px;justify-content:space-between;margin-top:14px}
  .stat{padding:0;flex-direction:column;gap:0}
  .screen{max-height:38vh}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- course plan ---------- */
.cw{border:1px solid var(--line);background:var(--panel);margin-bottom:16px}
.cw .chead{padding:15px 18px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--panel-2),var(--panel))}
.cw .cmeta{display:flex;gap:14px;align-items:center;flex-wrap:wrap;
  font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.cw .cmeta .wk{color:var(--amber)}
.cw .cmeta .dt{color:var(--cyan)}
.cw h1{font-family:var(--sans);font-size:21px;margin:9px 0 0;font-weight:600;line-height:1.3}
.cw .topics{font-family:var(--sans);color:var(--dim);font-size:13.5px;margin:7px 0 0}
.cw.milestone{border-color:var(--rose)}
.cw.milestone .chead{background:rgba(240,113,120,.1)}
.cw.milestone h1{color:var(--rose)}
.csec{padding:16px 18px;border-top:1px solid var(--line)}
.csec:first-of-type{border-top:0}
.csec h2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
  margin:0 0 12px;font-weight:500}
.lab{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.lab li{display:flex;gap:11px;align-items:flex-start;padding:9px 11px;
  border:1px solid var(--line);background:var(--panel-2);cursor:pointer}
.lab li:hover{border-color:#3B5063}
.lab li .box{flex:0 0 15px;width:15px;height:15px;margin-top:2px;position:relative;
  border:1px solid #3B5063;background:transparent}
.lab li.on{border-color:var(--lime);background:rgba(167,217,108,.07)}
.lab li.on .box{background:var(--lime);border-color:var(--lime)}
.lab li.on .box::after{content:"";position:absolute;left:5px;top:1px;width:4px;height:9px;
  border:solid var(--void);border-width:0 2px 2px 0;transform:rotate(45deg)}
.lab li.on .txt{color:var(--dim);text-decoration:line-through}
.lab .txt{font-family:var(--sans);font-size:14px;line-height:1.5}
.lab .txt code{font-family:var(--mono);font-size:12.5px;background:rgba(92,207,230,.1);
  color:var(--cyan);padding:1px 5px}
.chk{border:1px solid var(--line);background:var(--panel-2);margin-bottom:8px}
.chk summary{padding:10px 13px;cursor:pointer;font-family:var(--sans);font-size:14px;
  list-style:none;display:flex;gap:10px;align-items:flex-start}
.chk summary::-webkit-details-marker{display:none}
.chk summary::before{content:"?";flex:0 0 auto;color:var(--amber);font-family:var(--mono);
  font-weight:700;font-size:13px}
.chk summary:hover{background:var(--panel)}
.chk[open] summary{border-bottom:1px solid var(--line)}
.chk .ans{padding:11px 13px 13px 34px;font-family:var(--sans);font-size:13.5px;
  color:var(--dim);line-height:1.6}
.chk .ans code{font-family:var(--mono);font-size:12.5px;background:rgba(167,217,108,.1);
  color:var(--lime);padding:1px 5px}
.cnav{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}
.cprog{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
  padding:9px 0;margin-left:auto}
.cprog b{color:var(--lime);font-weight:500}
.hint-oh{font-family:var(--sans);font-size:13px;color:var(--dim);padding:11px 13px;
  border-left:2px solid var(--cyan);background:rgba(92,207,230,.05);margin:0}

/* ---------- course lab ---------- */
.cw .cbrief{font-family:var(--sans);font-size:13.5px;color:var(--bone);opacity:.85;margin:10px 0 0;
  padding-left:11px;border-left:2px solid var(--amber)}
.ltasks{list-style:none;margin:0;padding:0;counter-reset:none}
.ltask{display:flex;gap:12px;align-items:flex-start;padding:11px 13px;margin-bottom:8px;
  border:1px solid var(--line);background:var(--panel-2)}
.ltask.done{border-color:var(--lime);background:rgba(167,217,108,.07)}
.ltask .lnum{flex:0 0 22px;height:22px;line-height:20px;text-align:center;font-size:12px;
  border:1px solid var(--line);color:var(--dim)}
.ltask.done .lnum{border-color:var(--lime);color:var(--lime)}
.ltask .lbody{flex:1;min-width:0}
.ltask .ltext{font-family:var(--sans);font-size:14px;line-height:1.55;display:block}
.ltask.done .ltext{color:var(--dim)}
.ltask .ltext code{font-family:var(--mono);font-size:12.5px;background:rgba(92,207,230,.1);
  color:var(--cyan);padding:1px 5px}
.ltask .lstat{flex:0 0 auto;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--lime)}
.lhint{margin-top:7px;background:none;border:0;border-bottom:1px dotted var(--dim);color:var(--dim);
  font-family:var(--mono);font-size:11.5px;cursor:pointer;padding:0}
.lhint:hover{color:var(--amber);border-color:var(--amber)}
.lhinttext{display:block;margin-top:7px;font-family:var(--sans);font-size:13px;color:var(--amber);
  padding-left:10px;border-left:2px solid rgba(255,180,84,.4)}
/* an author display rule beats the hidden attribute, so restore it explicitly */
.lhinttext[hidden]{display:none}
.cprog{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:14px 0 0}
.cprog b{color:var(--lime);font-weight:500}
.cprog .allgood{color:var(--lime)}
.labterm{margin-bottom:16px;position:relative}
.labterm .screen{min-height:230px;max-height:44vh}
.tbtn{margin-left:auto;background:var(--panel);border:1px solid var(--line);color:var(--dim);
  font-family:var(--mono);font-size:11px;padding:3px 9px;cursor:pointer}
.tbtn:hover{color:var(--bone);border-color:#3B5063}
.editor{position:absolute;inset:0;background:var(--panel);border:1px solid var(--amber);
  display:flex;flex-direction:column;z-index:5}
.edhead{padding:9px 13px;border-bottom:1px solid var(--line);font-size:12px;color:var(--dim);
  display:flex;gap:12px;align-items:center}
.edhead b{color:var(--amber);font-weight:500}
.edhead .edhint{margin-left:auto;font-size:11px}
#ed-body{flex:1;width:100%;background:var(--void);color:var(--bone);border:0;resize:none;

const PMS = {

const MODULES = [
{
id:"nav", name:"Getting around",
guide:`<p>The shell always has a <b>current directory</b>. Every relative path you type is resolved from it, so the first skill is knowing where you are and moving deliberately.</p>
<p><code>.</code> is here, <code>..</code> is the parent, <code>~</code> is your home directory, and <code>/</code> is the root of the whole filesystem. A path starting with <code>/</code> is absolute; anything else is relative to where you stand.</p>
<p>Press <b>Tab</b> to complete names in a real shell, and <b>↑</b> to recall previous commands — both work in this trainer's input too.</p>`,
tasks:[
{q:"Show which directory you are currently in.", s:"pwd", p:["pwd"], h:"Three letters: print working directory.", w:[["pwd","Prints the absolute path of the directory you're standing in."]]},
{q:"List the contents of the current directory.", s:"ls", p:["ls"], h:"Two letters.", w:[["ls","Lists files and directories."]]},
{q:"List everything here, including hidden files, in long format with permissions and sizes.", s:"ls -la", p:["ls -(la|al)","ls -l -a","ls -a -l"], h:"Two options combined after a single dash.", w:[["ls","List directory contents."],["-l","Long format — permissions, owner, size, date."],["-a","All, including dotfiles like .bashrc."]]},
{q:"Move into the /etc directory.", s:"cd /etc", p:["cd /etc/?"], h:"Change directory, absolute path.", w:[["cd","Change directory."],["/etc","Absolute path — starts at root, so it works from anywhere."]]},
{q:"Go up one level, to the parent directory.", s:"cd ..", p:["cd \\.\\."], h:"Two dots mean 'the directory above this one'.", w:[["..","The parent directory. One dot (.) would mean the current one."]]},
{q:"Jump back to the directory you were in before the last cd.", s:"cd -", p:["cd -"], h:"A single character argument, not a path.", w:[["cd -","Toggles back to your previous directory. Press it again to return."]]},
{q:"Return to your home directory, in the shortest way possible.", s:"cd", p:["cd","cd ~","cd \\$HOME"], h:"cd with no argument does something useful.", w:[["cd","With no argument it goes home. cd ~ does the same thing explicitly."]]},
{q:"Wipe the visible output off the screen.", s:"clear", p:["clear"], h:"Ctrl+L does it too.", w:[["clear","Clears the terminal display. Your scrollback and history stay intact."]]}
]},
{
id:"files", name:"Files & directories",
guide:`<p>Linux has no undo and no recycle bin. <code>rm</code> deletes immediately and <code>mv</code> overwrites a destination without asking. Read the whole line before pressing Enter, especially when it contains <code>-r</code>, <code>-f</code> or a wildcard.</p>
<p>Most file commands follow the same shape: <code>command [options] source destination</code>.</p>`,
tasks:[
{q:"Create an empty file called notes.txt.", s:"touch notes.txt", p:["touch notes\\.txt"], h:"The command's real job is updating timestamps — but it creates missing files.", w:[["touch","Updates a file's timestamp, and creates it if it doesn't exist."]]},
{q:"Create the nested directory projects/linux/lab1 in one command, even though projects doesn't exist yet.", s:"mkdir -p projects/linux/lab1", p:["mkdir -p projects/linux/lab1/?"], h:"One option makes parent directories as needed.", w:[["mkdir","Make directory."],["-p","Parents — creates every missing level, and stays quiet if it already exists."]]},
{q:"Copy report.txt into /tmp.", s:"cp report.txt /tmp", p:["cp report\\.txt /tmp/?"], h:"Source first, destination second.", w:[["cp","Copy."],["report.txt /tmp","Source, then destination. The name is kept unless you give a new one."]]},
{q:"Copy the whole logs directory, with everything inside it, into /backup.", s:"cp -r logs /backup", p:["cp -(r|R|a) logs/? /backup/?"], h:"Directories need one extra option.", w:[["-r","Recursive — descends into the directory and copies its contents too."]]},
{q:"Rename old.conf to new.conf.", s:"mv old.conf new.conf", p:["mv old\\.conf new\\.conf"], h:"Renaming and moving are the same operation.", w:[["mv","Move. Within the same directory, moving a file to a new name is a rename."]]},
{q:"Delete the file temp.log.", s:"rm temp.log", p:["rm temp\\.log"], h:"Two letters.", w:[["rm","Remove. Permanent — there is no trash folder."]]},
{q:"Delete the directory cache and everything in it, without being prompted.", s:"rm -rf cache", p:["rm -(rf|fr|Rf|fR) cache/?","rm -r -f cache/?","rm -f -r cache/?"], h:"Recursive plus force.", w:[["-r","Recursive — needed for directories."],["-f","Force — no prompts, no complaints about missing files."],["⚠","rm -rf with a wrong path is the classic way to destroy a system. Check the path first."]]},
{q:"Create a symbolic link in your home directory called syslog that points to /var/log/syslog.", s:"ln -s /var/log/syslog ~/syslog", p:["ln -s /var/log/syslog (~|/root|\\$HOME)/syslog"], h:"Link, symbolic, target first.", w:[["ln -s","Creates a symbolic link — a pointer to another path, like a shortcut."],["order","Target first, then the name of the link you're creating."]]},
{q:"Remove the empty directory called scratch.", s:"rmdir scratch", p:["rmdir scratch/?"], h:"There's a dedicated command that only works on empty directories.", w:[["rmdir","Removes a directory only if it's empty — a safety net compared to rm -rf."]]}
]},
{
id:"read", name:"Reading & searching",
guide:`<p>Most troubleshooting is reading files and finding things in them. <code>grep</code> searches <b>inside</b> files for text; <code>find</code> searches the filesystem for <b>files themselves</b>. Mixing those two up is the most common beginner error.</p>
<p>For anything longer than a screen, reach for <code>less</code> instead of <code>cat</code>: <code>/</code> searches, <code>n</code> jumps to the next match, <code>q</code> quits.</p>`,
tasks:[
{q:"Print the entire contents of /etc/hostname to the screen.", s:"cat /etc/hostname", p:["cat /etc/hostname"], h:"Short for concatenate.", w:[["cat","Dumps a whole file to standard output. Fine for short files."]]},
{q:"Open /etc/services in a scrollable pager you can search and quit with q.", s:"less /etc/services", p:["less /etc/services","more /etc/services"], h:"It's the successor to a command called more.", w:[["less","Pages through a file. / searches, n = next match, q = quit."]]},
{q:"Show only the first 20 lines of access.log.", s:"head -n 20 access.log", p:["head -n ?20 access\\.log","head -20 access\\.log"], h:"The opposite of tail.", w:[["head","Shows the beginning of a file."],["-n 20","Number of lines. Default is 10."]]},
{q:"Show the last 20 lines of access.log.", s:"tail -n 20 access.log", p:["tail -n ?20 access\\.log","tail -20 access\\.log"], h:"Same shape as the previous task.", w:[["tail","Shows the end of a file — usually the newest log entries."]]},
{q:"Watch /var/log/syslog live, so new lines appear as they are written.", s:"tail -f /var/log/syslog", p:["tail -f /var/log/syslog","tail -F /var/log/syslog"], h:"One option means 'follow'.", w:[["-f","Follow — keeps the file open and streams new lines. Ctrl+C to stop."],["-F","Like -f but survives the file being rotated."]]},
{q:"Search app.log for the word error, ignoring uppercase and lowercase differences.", s:"grep -i error app.log", p:["grep -i \"?'?error\"?'? app\\.log"], h:"One option makes the match case-insensitive.", w:[["grep","Searches for a pattern inside files."],["-i","Ignore case — matches Error, ERROR and error."]]},
{q:"Search every file under /etc for the word password, showing line numbers.", s:"grep -rn password /etc", p:["grep -(rn|nr|Rn|nR) \"?'?password\"?'? /etc/?","grep -r -n \"?'?password\"?'? /etc/?","grep -n -r \"?'?password\"?'? /etc/?"], h:"Two options: one to descend into directories, one to number the hits.", w:[["-r","Recursive — walks down through every subdirectory."],["-n","Prints the line number of each match."],["tip","Add -i to also ignore case: grep -rin."]]},
{q:"Count how many lines are in access.log.", s:"wc -l access.log", p:["wc -l access\\.log"], h:"Word count, but limited to one unit.", w:[["wc","Word count — counts lines, words and bytes."],["-l","Lines only."]]},
{q:"Find every file ending in .conf under the current directory.", s:"find . -name \"*.conf\"", p:["find \\.? -name \"?'?\\*\\.conf\"?'?"], h:"Start the search at the current directory, then filter by name.", w:[["find .","Searches recursively, starting from the current directory."],["-name \"*.conf\"","Filters by filename. Quote the wildcard so the shell passes it to find untouched."]]},
{q:"Find files under the current directory that were modified in the last 7 days.", s:"find . -mtime -7", p:["find \\.? -mtime -7"], h:"Modification time, in days. The minus sign means 'less than'.", w:[["-mtime -7","Modified fewer than 7 days ago. +7 would mean older than 7 days."]]},
{q:"Show the full path of the nmap executable that your shell would run.", s:"which nmap", p:["which nmap","command -v nmap","type nmap"], h:"Answers 'which one of these would actually run?'", w:[["which","Reports the path of the binary found first in your $PATH."]]}
]},
{
id:"perms", name:"Permissions & ownership",
guide:`<p>Every file has an owner, a group, and three permission sets: <b>user</b>, <b>group</b>, <b>other</b>. In <code>ls -l</code> output, <code>-rwxr-xr--</code> reads as: regular file, owner can read/write/execute, group can read/execute, everyone else can only read.</p>
<p>Numeric mode adds them up: <b>r=4, w=2, x=1</b>. So <code>755</code> is rwx for the owner and r-x for group and other, and <code>600</code> is read/write for the owner only — which is what SSH private keys must be.</p>`,
tasks:[
{q:"Show the permissions and owner of /etc/passwd.", s:"ls -l /etc/passwd", p:["ls -l /etc/passwd"], h:"Long format on a single file.", w:[["ls -l","Long listing: type, permissions, links, owner, group, size, date."]]},
{q:"Make the file deploy.sh executable, without changing its other permissions.", s:"chmod +x deploy.sh", p:["chmod \\+x deploy\\.sh","chmod a\\+x deploy\\.sh","chmod u\\+x deploy\\.sh"], h:"Symbolic mode: add the execute bit.", w:[["chmod","Change mode (permissions)."],["+x","Adds the execute bit. Without it, ./deploy.sh gives 'Permission denied'."]]},
{q:"Set script.sh to 755 using numeric mode.", s:"chmod 755 script.sh", p:["chmod 0?755 script\\.sh"], h:"Three digits: owner, group, other.", w:[["7 = rwx","Owner can read, write and execute (4+2+1)."],["5 = r-x","Group and other can read and execute (4+1). The standard mode for scripts and programs."]]},
{q:"Lock down the private key id_rsa so only its owner can read and write it.", s:"chmod 600 id_rsa", p:["chmod 0?600 id_rsa"], h:"Read+write for the owner, nothing for anyone else.", w:[["6 = rw-","Owner reads and writes (4+2)."],["00","No access at all for group or other. SSH refuses to use a key that others can read."]]},
{q:"Give the /var/www directory to the user and group www-data.", s:"sudo chown www-data:www-data /var/www", p:["chown www-data:www-data /var/www/?","chown -R www-data:www-data /var/www/?"], h:"Owner and group are separated by a colon.", w:[["chown","Change owner."],["user:group","Sets both at once. Add -R to apply it through a whole directory tree."],["sudo","Changing ownership requires root."]]},
{q:"Change only the group of report.txt to analysts.", s:"chgrp analysts report.txt", p:["chgrp analysts report\\.txt","chown :analysts report\\.txt"], h:"There's a dedicated command, or chown with an empty user part.", w:[["chgrp","Change group. chown :analysts file does the same thing."]]},
{q:"Print the username you are currently logged in as.", s:"whoami", p:["whoami"], h:"One word, exactly as you'd ask it.", w:[["whoami","Prints your effective username. Under sudo it prints root."]]},
{q:"Show your user ID, group ID and every group you belong to.", s:"id", p:["id"], h:"Two letters.", w:[["id","Shows uid, gid and all group memberships — the fastest way to check access."]]},
{q:"Open a full interactive root shell.", s:"sudo -i", p:["sudo -i","sudo -s","sudo su -?","su -?"], h:"sudo with one option gives you a login shell.", w:[["sudo -i","Starts an interactive login shell as root, with root's environment."],["caution","Everything you type afterwards runs as root. Prefer per-command sudo."]]}
]},
{
id:"pkg", name:"Installing software",
guide:`<p>Each distro family has its own package manager, but they all do the same six things: install, search, remove, update, inspect, and tell you which package owns a file. Use the <b>Distro</b> switch at the top to practise the one your class runs.</p>
<p>Letters are not random. In <code>pacman -Syu</code>, the uppercase letter is the <i>operation</i> (<code>S</code> = sync from repos) and the lowercase letters are options: <code>y</code> refreshes the package databases, <code>u</code> upgrades everything installed.</p>
<p>Installing needs root, so those commands take <code>sudo</code>. Searching and inspecting only read, so they don't.</p>`,
byPm:true,
tasks:[
{q:"Install Firefox from the repositories.",
 v:{pacman:{s:"sudo pacman -S firefox",p:["pacman -S firefox"],w:[["-S","Sync — installs from the configured repositories."],["sudo","Writing to the system needs root."]]},
    apt:{s:"sudo apt install firefox",p:["apt(-get)? install firefox"],w:[["apt install","Installs a package and its dependencies."],["sudo","Writing to the system needs root."]]},
    dnf:{s:"sudo dnf install firefox",p:["dnf install firefox","yum install firefox"],w:[["dnf install","Resolves dependencies and installs."],["sudo","Writing to the system needs root."]]},
    zypper:{s:"sudo zypper install firefox",p:["zypper (install|in) firefox"],w:[["zypper install","Installs a package. Short form: zypper in."]]}},
 h:"The operation is 'install' — and it writes to the system."},
{q:"Search the repositories for anything matching nmap.",
 v:{pacman:{s:"pacman -Ss nmap",p:["pacman -Ss nmap"],w:[["-S","Sync operation."],["s","search — searches names and descriptions."],["no sudo","Searching only reads, so root isn't needed."]]},
    apt:{s:"apt search nmap",p:["apt search nmap","apt-cache search nmap"],w:[["apt search","Searches package names and descriptions."]]},
    dnf:{s:"dnf search nmap",p:["dnf search nmap","yum search nmap"],w:[["dnf search","Searches the repository metadata."]]},
    zypper:{s:"zypper search nmap",p:["zypper (search|se) nmap"],w:[["zypper search","Searches available packages. Short form: zypper se."]]}},
 h:"Same operation as installing, plus a search option. No root needed."},
{q:"Show detailed information about the firefox package before installing it.",
 v:{pacman:{s:"pacman -Si firefox",p:["pacman -Si firefox"],w:[["-Si","Sync + info — details for a package in the repos."],["-Qi","Would show info for an already installed package."]]},
    apt:{s:"apt show firefox",p:["apt show firefox","apt-cache show firefox"],w:[["apt show","Version, size, dependencies and description."]]},
    dnf:{s:"dnf info firefox",p:["dnf info firefox","yum info firefox"],w:[["dnf info","Version, repo, size and summary."]]},
    zypper:{s:"zypper info firefox",p:["zypper info firefox"],w:[["zypper info","Detailed package metadata."]]}},
 h:"You want the package's info, not to install it."},
{q:"Refresh the package lists and upgrade every installed package.",
 v:{pacman:{s:"sudo pacman -Syu",p:["pacman -Syu"],w:[["S","Sync operation."],["y","Refresh — re-downloads the package databases from your mirrors."],["u","Upgrade everything that has a newer version."],["never -Sy alone","Refreshing without upgrading leads to partial upgrades, which break Arch systems."]]},
    apt:{s:"sudo apt update && sudo apt upgrade",p:["apt(-get)? update && (sudo )?apt(-get)? (upgrade|full-upgrade|dist-upgrade)( -y)?"],w:[["apt update","Downloads new package lists. It upgrades nothing by itself."],["&&","Runs the second command only if the first succeeded."],["apt upgrade","Installs the newer versions."]]},
    dnf:{s:"sudo dnf upgrade",p:["dnf (upgrade|update)( --refresh)?( -y)?","yum update"],w:[["dnf upgrade","Refreshes metadata and upgrades in one step."]]},
    zypper:{s:"sudo zypper update",p:["zypper (update|up|dup|refresh && (sudo )?zypper update)"],w:[["zypper update","Updates installed packages. It only re-reads the repositories if they have autorefresh enabled — run zypper refresh first to be certain."],["zypper dup","Distribution upgrade, which is the normal update path on Tumbleweed."]]}},
 h:"Two things have to happen: refresh, then upgrade."},
{q:"Remove firefox together with the dependencies nothing else needs.",
 v:{pacman:{s:"sudo pacman -Rns firefox",p:["pacman -R(ns|sn|s) firefox"],w:[["R","Remove operation."],["s","Recursive — also removes dependencies no other package needs."],["n","Deletes configuration files instead of leaving .pacsave copies."],["why not plain -R","pacman -R firefox removes only firefox and leaves every dependency behind. The s is what this task asks for."]]},
    apt:{s:"sudo apt autoremove firefox",p:["apt(-get)? autoremove firefox( -y)?","apt(-get)? (remove|purge) --auto-remove firefox( -y)?"],w:[["apt remove","Removes the package but keeps config files — and leaves its dependencies installed."],["apt purge","Also removes config files."],["autoremove","Cleans up dependencies nothing needs any more. Plain apt remove does not do this."]]},
    dnf:{s:"sudo dnf remove firefox",p:["dnf (remove|erase|autoremove) firefox( -y)?","yum remove firefox"],w:[["dnf remove","Removes the package and any dependencies it pulled in on its own."]]},
    zypper:{s:"sudo zypper remove firefox",p:["zypper (remove|rm) firefox( --clean-deps)?"],w:[["zypper remove","Removes a package. Short form: zypper rm."]]}},
 h:"The remove operation, plus the option that cleans up orphaned dependencies."},
{q:"Find out which installed package owns the file /usr/bin/ls.",
 v:{pacman:{s:"pacman -Qo /usr/bin/ls",p:["pacman -Qo /usr/bin/ls"],w:[["Q","Query — asks about locally installed packages, not the repos."],["o","owns — reports which package a file came from."]]},
    apt:{s:"dpkg -S /usr/bin/ls",p:["dpkg (-S|--search) /usr/bin/ls","apt-file search /usr/bin/ls"],w:[["dpkg -S","Searches the installed package database for a file. apt itself can't do this."]]},
    dnf:{s:"dnf provides /usr/bin/ls",p:["dnf (provides|whatprovides) /usr/bin/ls","rpm -qf /usr/bin/ls"],w:[["dnf provides","Reports which package supplies a given file or capability."],["rpm -qf","Does the same for files already on disk."]]},
    zypper:{s:"zypper search --provides /usr/bin/ls",p:["zypper (search|se) (--provides|--file-list) /usr/bin/ls","rpm -qf /usr/bin/ls"],w:[["--provides","Searches by what a package provides rather than by name."]]}},
 h:"You're querying the local system, not the repositories."},
{q:"List every package currently installed on the system.",
 v:{pacman:{s:"pacman -Q",p:["pacman -Q(e|n)?"],w:[["-Q","Query with no filter lists everything installed."],["-Qe","Only the ones you installed explicitly — useful for rebuilding a system."]]},
    apt:{s:"apt list --installed",p:["apt list --installed","dpkg (-l|--list)"],w:[["apt list --installed","Everything currently installed, with versions."]]},
    dnf:{s:"dnf list installed",p:["dnf list installed","rpm -qa","yum list installed"],w:[["dnf list installed","Installed packages and which repo they came from."]]},
    zypper:{s:"zypper search --installed-only",p:["zypper (search|se) (--installed-only|-i)","rpm -qa"],w:[["--installed-only","Restricts the search to packages already on the system."]]}},
 h:"Query the local database with no name filter."},
{q:"Free up disk space by clearing out the downloaded package cache.",

    apt:{s:"sudo apt clean",p:["apt(-get)? (clean|autoclean)"],w:[["apt clean","Empties /var/cache/apt/archives."],["autoclean","Only removes packages that can no longer be downloaded."]]},
    dnf:{s:"sudo dnf clean all",p:["dnf clean (all|packages)","yum clean all"],w:[["dnf clean all","Clears cached packages and repository metadata."]]},

MODULES.push(
{
id:"proc", name:"Processes & services",
guide:`<p>Everything running is a <b>process</b> with a numeric PID. Long-lived background processes managed by the system — sshd, nginx, docker — are <b>services</b> (units), and on almost every modern distro they are controlled by <code>systemctl</code>.</p>
<p>The usual sequence when something is broken: <code>systemctl status</code> to see the state, then <code>journalctl -u &lt;unit&gt;</code> to read why.</p>`,
tasks:[
{q:"Show every running process on the system, with the user and CPU usage for each.", s:"ps aux", p:["ps aux","ps -ef","ps auxf"], h:"Three letters of options, no dash needed in the classic form.", w:[["ps aux","a = processes belonging to every user that have a terminal, u = user-oriented columns, x = adds the ones with no terminal. It takes a and x together to mean 'everything'."],["ps -ef","The same idea in POSIX style."]]},
{q:"Open a live, continuously updating view of running processes.", s:"top", p:["top","htop","btop"], h:"Three letters. htop is the friendlier version, if it's installed.", w:[["top","Refreshes every few seconds. q quits, k kills a PID."],["htop","Nicer interface with colour, scrolling and mouse support — usually needs installing."]]},
{q:"Force-kill the process with PID 4821, which has stopped responding.", s:"kill -9 4821", p:["kill -9 4821","kill -(KILL|SIGKILL) 4821"], h:"Signal 9 cannot be caught or ignored.", w:[["kill","Sends a signal to a process. Default is 15 (TERM), a polite request to exit."],["-9","SIGKILL — the kernel terminates it immediately. Try plain kill first; -9 skips cleanup."]]},
{q:"Kill every process whose command line matches 'node server.js', by name rather than PID.", s:"pkill -f \"node server.js\"", p:["pkill -f \"?'?node server\\.js\"?'?"], h:"There's a kill variant that takes a pattern.", w:[["pkill","Kills by name instead of PID."],["-f","Matches against the full command line, not just the process name."]]},
{q:"Check whether the sshd service is running.", s:"systemctl status sshd", p:["systemctl status (sshd|ssh)(\\.service)?"], h:"The systemd control command, plus the sub-command you'd expect.", w:[["systemctl status","Shows active/inactive state, the PID, and the last few log lines."]]},
{q:"Restart the nginx service.", s:"sudo systemctl restart nginx", p:["systemctl restart nginx(\\.service)?"], h:"Same tool, different sub-command. It changes system state.", w:[["restart","Stops and starts the unit. Use reload instead if you only changed config and the service supports it."],["sudo","Changing service state needs root."]]},
{q:"Start the docker service now and also make it start automatically at every boot.", s:"sudo systemctl enable --now docker", p:["systemctl enable --now docker(\\.service)?","systemctl enable docker(\\.service)? && (sudo )?systemctl start docker(\\.service)?"], h:"enable handles boot; one option also starts it immediately.", w:[["enable","Creates the symlink so the unit starts at boot."],["--now","Also starts it right away, so you don't need a separate start."]]},
{q:"Follow the log output of the ssh unit live.", s:"journalctl -u ssh -f", p:["journalctl -u (ssh|sshd)(\\.service)? -f","journalctl -f -u (ssh|sshd)(\\.service)?"], h:"The systemd journal, filtered to one unit, in follow mode.", w:[["journalctl","Reads the systemd journal — the central log."],["-u ssh","Filters to a single unit."],["-f","Follow, like tail -f."],["also useful","-b for this boot only, -p err for errors and worse."]]},
{q:"Show the last 50 journal entries with priority error or worse.", s:"journalctl -p err -n 50", p:["journalctl -p (err|3) -n ?50","journalctl -n ?50 -p (err|3)"], h:"Filter by priority, limit the number of lines.", w:[["-p err","Priority error and above (critical, alert, emergency)."],["-n 50","The last 50 matching entries."]]}
]},
{
id:"sys", name:"Disk & system health",
guide:`<p>Two commands people constantly confuse: <code>df</code> reports free space per <b>filesystem</b>, while <code>du</code> measures how much space specific <b>directories</b> are using. When a disk fills up, you run <code>df -h</code> to find which mount point is full, then <code>du -sh *</code> inside it to find the culprit.</p>
<p><code>-h</code> means human-readable on most of these — GB and MB instead of raw blocks.</p>`,
tasks:[
{q:"Show free and used disk space for every mounted filesystem, in readable units.", s:"df -h", p:["df -h"], h:"Disk free, human-readable.", w:[["df","Disk free, per filesystem."],["-h","Human-readable sizes (G, M) instead of 1K blocks."]]},
{q:"Show the total size of /var/log as a single readable number.", s:"du -sh /var/log", p:["du -(sh|hs) /var/log/?"], h:"Disk usage, summarised.", w:[["du","Disk usage — walks the directory and adds up file sizes."],["-s","Summary — one total instead of a line per subdirectory."],["-h","Human-readable."]]},
{q:"Show how much RAM and swap are in use, in readable units.", s:"free -h", p:["free -h"], h:"One word, plus the usual option.", w:[["free -h","Total, used, free and available memory. Look at 'available', not 'free' — cache counts as reusable."]]},
{q:"Print the kernel version and full system information.", s:"uname -a", p:["uname -a","uname -r"], h:"Unix name, all fields.", w:[["uname -a","Kernel name, hostname, kernel release, build date and architecture."],["-r","Just the kernel release, which is what you usually need."]]},
{q:"Show how long the system has been running.", s:"uptime", p:["uptime"], h:"One word.", w:[["uptime","Time since boot, logged-in users, and the 1/5/15-minute load averages."]]},
{q:"List the block devices and partitions attached to this machine.", s:"lsblk", p:["lsblk","lsblk -f"], h:"list block devices, all one word.", w:[["lsblk","Tree of disks, partitions and mount points."],["-f","Adds filesystem type, label and UUID."]]},
{q:"Mount the partition /dev/sdb1 at /mnt.", s:"sudo mount /dev/sdb1 /mnt", p:["mount /dev/sdb1 /mnt/?"], h:"Device first, then where it should appear.", w:[["mount","Attaches a filesystem into the directory tree."],["order","Device, then mount point. umount /mnt detaches it again."]]},
{q:"Show the CPU model and core count.", s:"lscpu", p:["lscpu","cat /proc/cpuinfo"], h:"Same naming pattern as lsblk.", w:[["lscpu","Architecture, model, cores, threads and cache sizes."]]},
{q:"Print the current date and time.", s:"date", p:["date","timedatectl"], h:"One word.", w:[["date","Current date and time. date +%F prints just 2026-08-27, handy in filenames."]]}
]},
{
id:"net", name:"Networking",
guide:`<p>The old tools (<code>ifconfig</code>, <code>netstat</code>, <code>route</code>) still show up in tutorials but are deprecated. Modern equivalents: <code>ip</code> for addresses and routes, <code>ss</code> for sockets.</p>
<p>For security work, <code>ss -tulpn</code> is the one to memorise — it answers "what is listening on this machine, and which process owns it?"</p>`,
tasks:[
{q:"Show the IP addresses configured on all network interfaces.", s:"ip a", p:["ip (a|addr|address)( show)?","ifconfig"], h:"Two characters. The old name was ifconfig.", w:[["ip a","Short for ip address show — interfaces, their state and their addresses."]]},
{q:"Display the kernel routing table, including the default gateway.", s:"ip r", p:["ip (r|route)( show)?","route -n","netstat -rn"], h:"Same tool as the previous task, different object.", w:[["ip r","Routing table. The 'default via ...' line is your gateway."]]},
{q:"Send exactly 4 ping packets to example.com.", s:"ping -c 4 example.com", p:["ping -c ?4 example\\.com"], h:"Without the option it pings forever.", w:[["ping","Tests reachability with ICMP echo requests."],["-c 4","Count — stop after 4 packets."]]},
{q:"List all listening TCP and UDP ports with the process that owns each one.", s:"sudo ss -tulpn", p:["ss -(?!.*(.).*\\1)[tulpn]{5}","netstat -(?!.*(.).*\\1)[tulpn]{5}"], h:"Five option letters. Root is needed to see process names.", w:[["ss","Socket statistics — the replacement for netstat."],["-t / -u","TCP / UDP sockets."],["-l","Listening sockets only."],["-p","Shows the owning process (needs root)."],["-n","Numeric — don't resolve ports to service names."]]},
{q:"Fetch only the HTTP response headers from https://example.com.", s:"curl -I https://example.com", p:["curl -I https://example\\.com/?","curl --head https://example\\.com/?"], h:"An uppercase option that means 'head'.", w:[["curl","Transfers data to or from a URL."],["-I","Sends a HEAD request — status line and headers, no body."]]},
{q:"Download the file at https://example.com/file.iso to the current directory.", s:"wget https://example.com/file.iso", p:["wget https://example\\.com/file\\.iso","curl -O https://example\\.com/file\\.iso","curl -o file\\.iso https://example\\.com/file\\.iso"], h:"Either the dedicated downloader, or curl with an option that saves to a file.", w:[["wget URL","Downloads and saves using the remote filename."],["curl -O","Does the same with curl. Lowercase -o lets you choose the name."]]},
{q:"Look up the DNS records for example.com.", s:"dig example.com", p:["dig example\\.com( A)?","nslookup example\\.com","host example\\.com"], h:"Three letters — the detailed DNS tool.", w:[["dig","Full DNS query output with the answer section and TTLs."],["dig +short","Prints just the address, when that's all you need."]]},
{q:"Trace the network path taken to reach example.com.", s:"traceroute example.com", p:["traceroute example\\.com","tracepath example\\.com","mtr example\\.com"], h:"One word, describes exactly what it does.", w:[["traceroute","Lists every router hop between you and the target, with latency per hop."]]},
{q:"Check whether TCP port 22 is open on 10.0.0.5, without sending any data.", s:"nc -zv 10.0.0.5 22", p:["nc -(zv|vz) 10\\.0\\.0\\.5 22","netcat -(zv|vz) 10\\.0\\.0\\.5 22"], h:"netcat, in scan mode, verbose.", w:[["nc","netcat — the general-purpose TCP/UDP tool."],["-z","Zero-I/O — just test whether the port accepts a connection."],["-v","Verbose, so it actually tells you the result."]]},
{q:"Connect over SSH to the host 10.0.0.5 as the user admin.", s:"ssh admin@10.0.0.5", p:["ssh admin@10\\.0\\.0\\.5","ssh -l admin 10\\.0\\.0\\.5"], h:"user@host.", w:[["ssh user@host","Opens an encrypted remote shell. Add -p 2222 for a non-standard port."]]},
{q:"Copy report.pdf to /tmp on 10.0.0.5, logging in as admin.", s:"scp report.pdf admin@10.0.0.5:/tmp", p:["scp report\\.pdf admin@10\\.0\\.0\\.5:/tmp/?"], h:"Like cp, but the destination is host:path.", w:[["scp","Copies files over SSH."],["host:/tmp","The colon separates the host from the remote path. Forget it and you just make a local file."]]}
]},
{
id:"pipes", name:"Pipes, redirection & text",
guide:`<p>This is where the shell stops being a file browser and becomes a toolkit. Each command reads <b>stdin</b> and writes <b>stdout</b> and <b>stderr</b>; the pipe <code>|</code> connects one command's output to the next one's input, and <code>&gt;</code> sends output to a file instead of the screen.</p>
<p><code>&gt;</code> overwrites, <code>&gt;&gt;</code> appends, and <code>2&gt;&amp;1</code> folds error output into normal output so both travel down the same pipe.</p>`,
tasks:[
{q:"Save the output of ls into a file called files.txt, replacing anything already in it.", s:"ls > files.txt", p:["ls ?> ?files\\.txt"], h:"One angle bracket.", w:[[">","Redirects stdout to a file, truncating it first."]]},
{q:"Append the text \"backup done\" to the end of run.log without erasing it.", s:"echo \"backup done\" >> run.log", p:["echo \"?'?backup done\"?'? ?>> ?run\\.log"], h:"Two angle brackets means append.", w:[["echo","Prints its argument."],[">>","Appends instead of overwriting. Getting this wrong destroys the log."]]},
{q:"Show only the running processes whose lines mention nginx.", s:"ps aux | grep nginx", p:["ps (aux|-ef) \\| grep -?i? ?nginx","pgrep -a nginx"], h:"Pipe the process list into a search.", w:[["|","Feeds the left command's stdout into the right command's stdin."],["grep nginx","Keeps only matching lines. pgrep does the same job in one step."]]},
{q:"Count how many lines in access.log contain the text 404.", s:"grep -c 404 access.log", p:["grep -c \"?'?404\"?'? access\\.log","grep \"?'?404\"?'? access\\.log \\| wc -l"], h:"grep can count on its own, or you can pipe into wc -l.", w:[["-c","Counts matching lines instead of printing them."]]},
{q:"Sort the lines of hosts.txt alphabetically and show each unique line with a count of how often it appeared.", s:"sort hosts.txt | uniq -c", p:["sort hosts\\.txt \\| uniq -c"], h:"uniq only collapses neighbouring duplicates, so sorting has to come first.", w:[["sort","Orders the lines — required, because uniq only sees adjacent lines."],["uniq -c","Collapses duplicates and prefixes each with its count."],["add | sort -rn","To rank the results from most to least frequent."]]},
{q:"Print only the usernames — the first colon-separated field — from /etc/passwd.", s:"cut -d: -f1 /etc/passwd", p:["cut -d ?\"?'?:\"?'? -f ?1 /etc/passwd","awk -F ?\"?'?:\"?'? '?\\{print \\$1\\}'? /etc/passwd"], h:"Set the delimiter, then choose the field.", w:[["cut","Extracts columns from each line."],["-d:","Delimiter is a colon."],["-f1","Field 1. awk -F: '{print $1}' does the same thing."]]},
{q:"Print just the first whitespace-separated column of access.log — the client IP addresses.", s:"awk '{print $1}' access.log", p:["awk '?\\{ ?print \\$1 ?\\}'? access\\.log"], h:"awk splits on whitespace by default; $1 is the first field.", w:[["awk","A small text-processing language. Splits each line into $1, $2, $3..."],["{print $1}","The action to run on every line."],["not cut","cut -d\" \" -f1 looks equivalent but splits on one literal space, so a leading space or a run of spaces shifts the field. awk treats any run of whitespace as a single separator."]]},
{q:"Replace every occurrence of http with https in urls.txt and print the result.", s:"sed 's/http/https/g' urls.txt", p:["sed '?s/http/https/g'? urls\\.txt"], h:"Stream editor, substitute, globally.", w:[["sed","Stream editor — edits text as it flows past."],["s/old/new/","Substitute. Without the trailing g it only replaces the first match on each line."],["-i","Would edit the file in place instead of printing."]]},
{q:"Run ./build.sh and send both its normal output and its error output into build.log.", s:"./build.sh > build.log 2>&1", p:["\\./build\\.sh ?> ?build\\.log 2>&1","\\./build\\.sh &> ?build\\.log","\\./build\\.sh ?> ?build\\.log ?2>&1"], h:"Redirect stdout first, then point stderr at the same place.", w:[["> build.log","Sends stdout (stream 1) to the file."],["2>&1","Sends stderr (stream 2) to wherever stream 1 currently goes. Order matters."],["&>","Bash shorthand for both at once."]]},
{q:"Show the output of make on screen and save a copy to build.log at the same time.", s:"make | tee build.log", p:["make \\| tee -?a? ?build\\.log"], h:"Named after a T-shaped pipe fitting.", w:[["tee","Splits the stream — writes to the file and passes it on to stdout."],["-a","Appends rather than overwriting."]]},
{q:"Find every .tmp file under the current directory and delete them all in one line.", s:"find . -name \"*.tmp\" | xargs rm", p:["find \\.? -name \"?'?\\*\\.tmp\"?'? \\| xargs rm( -f)?","find \\.? -name \"?'?\\*\\.tmp\"?'? -delete","find \\.? -name \"?'?\\*\\.tmp\"?'? -exec rm( -f)? \\{\\} \\\\?\\+?;?"], h:"Pipe the list of paths into something that turns them into arguments — or let find do it itself.", w:[["xargs","Turns lines of input into arguments for another command."],["-print0 / -0","Safer with spaces in filenames: find ... -print0 | xargs -0 rm."],["-delete","find can delete matches itself, with no pipe at all."]]},
{q:"Search your shell history for previous commands containing ssh.", s:"history | grep ssh", p:["history \\| grep -?i? ?ssh"], h:"Your history is just text — pipe it.", w:[["history","Prints your previously run commands, numbered."],["| grep ssh","Filters that list. Ctrl+R searches history interactively."]]}
]},
{
id:"adv", name:"Advanced & security",
guide:`<p>These are the commands that turn up in incident response and hardening work: archiving evidence, verifying integrity, checking who logged in, and finding files with dangerous permissions.</p>
<p>A <b>SUID</b> binary runs with its owner's privileges rather than yours. Legitimate ones exist (<code>passwd</code> needs it), but an unexpected root-owned SUID file is a classic privilege-escalation route, which is why <code>find / -perm -4000</code> is a standard audit step.</p>`,
tasks:[
{q:"Create a gzip-compressed archive called backup.tar.gz from the directory /home/analyst.", s:"tar -czvf backup.tar.gz /home/analyst", p:["tar -?(czvf|cvzf|zcvf|czf|zcf) backup\\.tar\\.gz /home/analyst/?"], h:"create, gzip, file — the option order matters, f comes last.", w:[["-c","Create a new archive."],["-z","Compress with gzip."],["-v","Verbose — list files as they're added."],["-f name","File — must come immediately before the archive name. tar -cfz backup.tar.gz would read the z as the filename and write an archive literally called z."],["-j and -J","bzip2 and xz instead of gzip. They still succeed, but you get a bzip2 or xz archive wearing a .gz name — the extension never sets the format."],["leaving -z out","tar -cvf backup.tar.gz produces an uncompressed archive with a misleading name."]]},
{q:"Extract the archive evidence.tar.gz into the current directory.", s:"tar -xzvf evidence.tar.gz", p:["tar -?(xzvf|xvzf|zxvf|xzf|zxf|xvf|xf) evidence\\.tar\\.gz"], h:"Same shape as creating, but with extract instead of create.", w:[["-x","Extract."],["tip","Modern GNU tar detects the compression itself, so -xvf and -xf work here too."],["-j and -J","Force bzip2 and xz. On a gzip file they fail outright: 'bzip2: (stdin) is not a bzip2 file'."],["-xfz","Fails with 'tar: z: Cannot open' — f takes the very next word as the filename, so f still has to come last."]]},
{q:"Generate a new SSH key pair using the ed25519 algorithm.", s:"ssh-keygen -t ed25519", p:["ssh-keygen -t ed25519( -C .*)?"], h:"The key generator, with a type option.", w:[["ssh-keygen","Creates a key pair: a private key and a .pub public key."],["-t ed25519","Key type. Preferred over RSA — shorter, faster, and strong."],["-C","Optional comment, usually your email, to label the key."]]},
{q:"Set the permissions on your ~/.ssh directory to the mode SSH requires.", s:"chmod 700 ~/.ssh", p:["chmod 0?700 (~|\\$HOME)/\\.ssh/?"], h:"Full access for you, nothing for anyone else.", w:[["700","rwx for the owner, nothing for group or other."],["why","SSH refuses to use keys if the directory or key file is readable by others."]]},
{q:"Verify the SHA-256 checksum of the file archlinux.iso.", s:"sha256sum archlinux.iso", p:["sha256sum archlinux\\.iso","shasum -a ?256 archlinux\\.iso"], h:"The algorithm name plus 'sum'.", w:[["sha256sum","Prints the file's hash so you can compare it against the published one."],["-c file","Checks a whole list of hashes from a checksum file."]]},
{q:"Find every SUID binary on the system, hiding permission errors.", s:"sudo find / -perm -4000 2>/dev/null", p:["find / -perm -(4000|u\\+s)( -type f)?( 2>/dev/null)?( -type f)?"], h:"Search from root by permission bits, and throw stderr away.", w:[["-perm -4000","Files with the SUID bit set. The leading dash means 'at least these bits'."],["2>/dev/null","Discards the permission-denied noise from directories you can't read."],["why it matters","A SUID binary runs as its owner — often root. Unexpected ones are an escalation risk."]]},
{q:"Show a list of recent login sessions on this machine.", s:"last", p:["last( -n ?\\d+)?"], h:"Four letters, reads /var/log/wtmp.", w:[["last","Login history: user, terminal, source address and duration."],["lastb","The same for failed login attempts — worth checking during an incident."]]},
{q:"Show who is currently logged in and what they are running.", s:"w", p:["w","who"], h:"A single letter.", w:[["w","Logged-in users plus their current process and idle time."],["who","Simpler — just users, terminals and login times."]]},
{q:"Show which process is listening on port 80.", s:"sudo lsof -i :80", p:["lsof -i ?:80","ss -tulpn \\| grep :?80","fuser 80/tcp"], h:"List open files — sockets count as files.", w:[["lsof","Lists open files; -i restricts it to network connections."],[":80","Filters to that port. ss -tulpn | grep :80 works too."]]},
{q:"Open your personal cron table for editing so you can schedule a job.", s:"crontab -e", p:["crontab -e"], h:"cron table, edit.", w:[["crontab -e","Opens your schedule in an editor."],["-l","Lists it without editing. Format: minute hour day month weekday command."]]},
{q:"Create the user analyst with a home directory.", s:"sudo useradd -m analyst", p:["useradd -m analyst","adduser analyst"], h:"An option is needed or they get no home directory.", w:[["useradd","Low-level account creation."],["-m","Creates /home/analyst and populates it from /etc/skel."],["adduser","A friendlier interactive wrapper on Debian-based systems."]]},
{q:"Change the password for the user analyst.", s:"sudo passwd analyst", p:["passwd analyst"], h:"One word plus the username.", w:[["passwd","Sets a password. With no username it changes your own."]]},
{q:"Run the previous command again as root, without retyping it.", s:"sudo !!", p:["sudo !!"], h:"Two exclamation marks expand to your last command.", w:[["!!","History expansion — the previous command line, inserted verbatim."],["sudo !!","The classic fix after 'Permission denied'."]]}
]}
);

/* =================== state =================== */
const S = {mode:"drill", pm:"pacman", m:0, t:0, solved:{}, tries:0, hits:0, streak:0, best:0,
           qDone:{}, qTries:0, qHits:0, c:0, lab:{},
           wrongInput:null, awaitingNext:false, hist:[], hp:0, busy:false};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* persistence — best effort, silently skipped when unavailable */
/* window.storage exists only inside some preview hosts; fall back to localStorage,
   then to memory, so progress survives a reload on a normal browser. */
const store = (window.storage && typeof window.storage.get === "function") ? window.storage : (()=>{
  try{
    const probe = "shelldrill:probe";
    localStorage.setItem(probe,"1"); localStorage.removeItem(probe);
    return { async get(k){ return {value: localStorage.getItem(k)}; },
             async set(k,v){ localStorage.setItem(k,v); } };
  }catch(e){
    const mem = {};
    return { async get(k){ return {value: mem[k] ?? null}; }, async set(k,v){ mem[k]=v; } };
  }
})();

async function save(){
  try{ await store.set("shelldrill:v1", JSON.stringify(
    {mode:S.mode, pm:S.pm, m:S.m, t:S.t, solved:S.solved, tries:S.tries, hits:S.hits, best:S.best,
     qDone:S.qDone, qTries:S.qTries, qHits:S.qHits, qt:Q.tier, qi:Q.i,
     c:S.c, lab:S.lab, seen:true})); }catch(e){}
}
async function load(){
  try{ const r = await store.get("shelldrill:v1");
    if(r && r.value){ const d = JSON.parse(r.value); Object.assign(S,{mode:d.mode||"drill",pm:d.pm||"pacman",m:d.m|0,t:d.t|0,
      solved:d.solved||{},tries:d.tries|0,hits:d.hits|0,best:d.best|0,
      qDone:d.qDone||{},qTries:d.qTries|0,qHits:d.qHits|0,
      c:d.c|0, lab:d.lab||{}});
    Q.tier=d.qt|0; Q.i=d.qi|0; return d.seen===true; }
  }catch(e){}
  return false;
}

/* =================== task access =================== */
const mod = () => MODULES[S.m];
function task(){
  const raw = mod().tasks[S.t];
  if(!raw.v) return raw;
  const v = raw.v[S.pm];
  return {q:raw.q, h:raw.h, s:v.s, p:v.p, w:v.w};
}
function outputFor(){
  if(mod().byPm){ const o = PKGOUT[S.t]; if(o && o[S.pm]) return o[S.pm]; }
  return OUT[mod().id + ":" + S.t] || [];
}
const key = () => mod().byPm ? mod().id+":"+S.t+":"+S.pm : mod().id+":"+S.t;

/* =================== matching =================== */
function rx(p){
  return new RegExp("^(?:sudo\\s+)?(?:" + p.replace(/ \?/g,"\\s*").replace(/ /g,"\\s+") + ")$");
}
function matches(input){
  const c = input.trim().replace(/\s+/g," ");
  return task().p.some(p => rx(p).test(c));
}

/* =================== tokenising & the debugger =================== */
function tokens(s){ return (s.trim().match(/(?:[^\s"']+|"[^"]*"|'[^']*')+/g) || []); }
function strip(t){ return t.filter(x => x !== "sudo"); }
function flagsOf(toks){
  const out = [];
  toks.forEach(t=>{
    if(t.startsWith("--")) out.push(t);
    else if(/^-[A-Za-z0-9]/.test(t)) t.slice(1).split("").forEach(c => out.push("-"+c));
  });
  return out;
}
function operands(toks){ return toks.slice(1).filter(t => !t.startsWith("-")); }
function lev(a,b){
  const d = Array.from({length:a.length+1},(_,i)=>[i,...Array(b.length).fill(0)]);
  for(let j=0;j<=b.length;j++) d[0][j]=j;
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++)
    d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1] + (a[i-1]===b[j-1]?0:1));
  return d[a.length][b.length];
}
function nearestCmd(w){
  let best=null, bd=99;
  Object.keys(CMDDESC).forEach(c=>{ const d=lev(w,c); if(d<bd){bd=d;best=c;} });
  return bd<=2 ? best : null;
}
function flagMeaning(cmd, f){
  const dict = FLAGS[cmd];
  if(dict && f.length===2 && dict[f[1]]) return dict[f[1]];
  return null;
}

/* returns [{sev, head, body}] explaining exactly what is wrong */
function diagnose(input){
  const t = task(), f = [];
  const push=(sev,head,body)=>f.push({sev,head,body});
  if(!input.trim()){ push("err","Nothing was entered","Type the command into the prompt and press Enter."); return f; }

  const uAll = tokens(input), eAll = tokens(t.s);
  const u = strip(uAll), e = strip(eAll);
  const uCmd = u[0] || "", eCmd = e[0] || "";
  const PMCMDS = ["pacman","apt","apt-get","dnf","yum","zypper"];

  /* 1 — is the command real? */
  if(!CMDDESC[uCmd]){
    const guess = nearestCmd(uCmd);
    push("err", "`" + uCmd + "` is not a command",
      guess ? "Nothing by that name exists on a standard system. You most likely meant <code>"+guess+"</code>, which "+CMDDESC[guess]+"."
            : "Nothing by that name exists on a standard system. Check the cheatsheet for the tool that fits this task.");
    return f;
  }

  /* 2 — right tool for the job? */
  if(uCmd !== eCmd){
    if(PMCMDS.includes(uCmd) && PMCMDS.includes(eCmd)){
      push("err","Wrong package manager for this distro",
        "<code>"+uCmd+"</code> "+CMDDESC[uCmd]+", but this session is set to <b>"+PMS[S.pm].label+"</b>, where the tool is <code>"+eCmd+"</code>. Either switch distro at the top of the page or use "+eCmd+".");
    } else {
      push("err","Wrong tool",
        "<code>"+uCmd+"</code> "+CMDDESC[uCmd]+". This task needs <code>"+eCmd+"</code>, which "+CMDDESC[eCmd]+".");
    }
    return f;
  }

  /* 3 — flags */
  const uf = flagsOf(u), ef = flagsOf(e);
  const missing = ef.filter(x => !uf.includes(x));
  const extra   = uf.filter(x => !ef.includes(x));
  missing.forEach(m=>{
    const mean = flagMeaning(eCmd, m);
    push("err","Missing <code>"+m+"</code>", mean ? "Without it you don't get: "+mean+"." :
      "The task needs this option. See the breakdown once you solve it, or check the cheatsheet.");
  });
  extra.forEach(x=>{
    const mean = flagMeaning(eCmd, x);
    push(mean?"warn":"err", (mean?"Unnecessary ":"Unknown ")+"<code>"+x+"</code>",
      mean ? "<code>"+x+"</code> means: "+mean+" — correct syntax, but not what this task asked for."
           : "<code>"+eCmd+"</code> has no such option, so it would exit with an error instead of running.");
  });

  /* 4 — operands */
  const uo = operands(u), eo = operands(e);
  const norm = s => s.replace(/^["']|["']$/g,"");
  if(uo.length < eo.length){
    const miss = eo.filter(x => !uo.some(y => norm(y)===norm(x)) && !/^(\||>|>>|&&|2>&1)$/.test(x));
    if(miss.length || !/[|>&]/.test(t.s))
    push("err","Missing argument", miss.length
      ? "<code>"+eCmd+"</code> still needs: <code>"+esc(miss.join(" "))+"</code>."
      : "The command needs "+eo.length+" argument"+(eo.length>1?"s":"")+", you gave "+uo.length+".");
  } else if(uo.length > eo.length && eo.length){
    push("warn","Too many arguments","This task only needs <code>"+esc(eo.join(" "))+"</code>. Extra words are passed to the command and usually cause an error.");
  } else {
    const same = uo.length===eo.length && uo.every(x=>eo.some(y=>norm(y)===norm(x)));
    if(same && uo.some((x,i)=>norm(x)!==norm(eo[i]))){
      push("err","Right arguments, wrong order",
        "Order matters here: <code>"+esc(eo.join(" "))+"</code>. Source comes before destination, and the target of a link comes before the link name.");
    } else {
      uo.forEach((x,i)=>{
        const want = eo[i]; if(!want) return;
        const a = norm(x), b = norm(want);
        if(a===b) return;
        if(a.toLowerCase()===b.toLowerCase())
          push("err","Wrong case in <code>"+esc(a)+"</code>","Linux filenames are case-sensitive — <code>"+esc(b)+"</code> and <code>"+esc(a)+"</code> are two different files.");
        else if(lev(a,b)<=2)
          push("err","Typo in <code>"+esc(a)+"</code>","It should read <code>"+esc(b)+"</code>.");
        else if(b.includes("*") && !/["']/.test(x) && a.includes("*"))
          push("warn","Unquoted wildcard","Quote it as <code>"+esc(b)+"</code>, otherwise the shell expands the <code>*</code> before the command ever sees it.");
        else
          push("err","Wrong argument","You passed <code>"+esc(a)+"</code>, the task asks for <code>"+esc(b)+"</code>.");
      });
    }
  }

  /* 5 — root */
  if(eAll[0]==="sudo" && uAll[0]!=="sudo")
    push("warn","No sudo","This command writes to the system, so on a real machine it would fail with <i>Permission denied</i>. Accepted here, but get into the habit.");

  /* 6 — pipes and redirection actually present? */
  [["|","a pipe"],[">","a redirect"],["&&","a chained &&"]].forEach(([sym,name])=>{
    if(t.s.includes(sym) && !input.includes(sym))
      push("err","Missing "+name+" <code>"+esc(sym)+"</code>","The task's shape is <code>"+esc(t.s)+"</code> — you need "+name+" to connect the two halves.");
  });

  if(!f.length) push("warn","Close, but not what the checker expects",
    "The pieces look right. Compare yours carefully with the shape the task wants, then use <b>Show answer</b> if you're stuck.");
  return f;
}

/* realistic shell error for an incorrect entry */
function errLine(input){
  const u = strip(tokens(input)), cmd = u[0] || "";
  if(!cmd) return null;
  if(!CMDDESC[cmd]) return "bash: " + cmd + ": command not found";
  const e = strip(tokens(task().s));
  if(cmd === e[0]){
    const bad = flagsOf(u).filter(x => !flagMeaning(cmd,x) && x.length===2 && !flagsOf(e).includes(x));
    if(bad.length) return cmd + ": invalid option -- '" + bad[0][1] + "'\nTry '" + cmd + " --help' for more information.";
    if(!operands(u).length && operands(e).length) return cmd + ": missing operand\nTry '" + cmd + " --help' for more information.";
    const eo = operands(e).map(x=>x.replace(/^["']|["']$/g,""));
    const first = (operands(u)[0]||"").replace(/^["']|["']$/g,"");
    if(first && !eo.includes(first) && /^[A-Za-z0-9~/._-]+$/.test(first) && !/^\d+$/.test(first))
      return cmd + ": cannot access '" + first + "': No such file or directory";
    return null;
  }
  return null;
}

const sleep = ms => new Promise(r=>setTimeout(r,ms));
const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

async function stream(lines){
  for(const item of lines){
    if(typeof item === "number"){ if(!reduced) await sleep(Math.min(item,900)); continue; }
    if(item === "CLEAR"){ $("screen").innerHTML = ""; continue; }
    let cls = "", txt = item;
    const c = txt[0];
    if(c==="~"){cls="note";txt=txt.slice(1);}
    else if(c==="!"){cls="err";txt=txt.slice(1);}
    else if(c==="$"){cls="ok";txt=txt.slice(1);}
    else if(c==="%"){cls="sys";txt=txt.slice(1);}
    line(esc(txt) || "&nbsp;", cls);
    if(!reduced) await sleep(38);
  }
}

/* =================== input =================== */
async function submit(raw){
  const input = raw.trim();
  if(!input || S.busy) return;
  S.hist.push(input); S.hp = S.hist.length;

  const meta = input.toLowerCase();
  if(meta==="clear"&&task().s!=="clear"){ $("screen").innerHTML=""; return; }
  if(meta==="hint"){ echoCmd(input); showHint(); line("~hint shown above the terminal","note"); return; }
  if(meta==="debug"){ echoCmd(input); showDebug(); line("~debugger output shown below","note"); return; }
  if(meta==="answer"||meta==="reveal"){ echoCmd(input); showAnswer(); return; }
  if(meta==="skip"||meta==="next"){ echoCmd(input); step(1); return; }
  if(meta==="ref"||meta==="cheat"){ echoCmd(input); openRef(); return; }
  if(meta==="tutorial"){ echoCmd(input); startTour(); return; }
  if(meta==="quiz"){ echoCmd(input); setMode("quiz"); return; }

  echoCmd(input);
  S.tries++;

  if(matches(input)){
    S.hits++; S.streak++; S.best = Math.max(S.best,S.streak);
    if(!S.solved[key()]) S.solved[key()] = true;
    S.busy = true;
    await stream(outputFor());
    S.busy = false;
    line("");
    celebrate(); renderModules(); save();
  } else {
    S.streak = 0; S.wrongInput = input;
    const e = errLine(input);
    if(e) e.split("\n").forEach(l=>line(esc(l),"err"));
    else line("~that runs, but it isn't what the task asked for","note");
    line('<span class="note">Not right yet — press <b>Debug my command</b> (or type <b>debug</b>) to see exactly why.</span>');
    renderModules(); save();
  }
}
$("entry").addEventListener("keydown", e=>{
  if(e.key==="Enter"){ const v=e.target.value; e.target.value=""; submit(v); }
  else if(e.key==="ArrowUp"){ e.preventDefault(); if(S.hp>0){ S.hp--; e.target.value=S.hist[S.hp]||""; } }
  else if(e.key==="ArrowDown"){ e.preventDefault(); if(S.hp<S.hist.length-1){ S.hp++; e.target.value=S.hist[S.hp]||""; } else { S.hp=S.hist.length; e.target.value=""; } }
  else if(e.key==="Enter"&&e.ctrlKey){ }
});
