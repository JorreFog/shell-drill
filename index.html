/* A small Python, scoped to what lectures 10-12 teach: types, arithmetic,
   strings and f-strings, lists/dicts/sets, if/loops, functions, and file I/O
   backed by the simulated filesystem. Not a general Python — but what it does
   support, it does honestly, including int/float distinction and real errors. */
function attachPython(K){
  const {vm, lookup, parentOf, baseOf, fnode} = K;

  class PyFloat { constructor(v){ this.v = v; } }
  class PyTuple { constructor(a){ this.a = a; } }
  class PyFunc  { constructor(name, params, defaults, body, closure){
    Object.assign(this, {name, params, defaults, body, closure}); } }
  class PyFile  { constructor(path, mode){ this.path = path; this.mode = mode; this.buf = ""; this.closed = false; } }
  class PyErr extends Error { constructor(type, msg){ super(msg); this.pytype = type; this.pymsg = msg; } }
  const err = (t,m) => { throw new PyErr(t,m); };

  const isInt   = v => typeof v === "number";
  const isFloat = v => v instanceof PyFloat;
  const isNum   = v => isInt(v) || isFloat(v);
  const num     = v => isFloat(v) ? v.v : v;
  const isStr   = v => typeof v === "string";

  function typeName(v){
    if(v === null) return "NoneType";
    if(typeof v === "boolean") return "bool";
    if(isInt(v)) return "int";
    if(isFloat(v)) return "float";
    if(isStr(v)) return "str";
    if(Array.isArray(v)) return "list";
    if(v instanceof Map) return "dict";
    if(v instanceof Set) return "set";
    if(v instanceof PyTuple) return "tuple";
    if(v instanceof PyFunc) return "function";
    if(v instanceof PyFile) return "TextIOWrapper";
    return "object";
  }

  function repr(v){
    if(v === null) return "None";
    if(typeof v === "boolean") return v ? "True" : "False";
    if(isFloat(v)) return Number.isInteger(v.v) ? v.v.toFixed(1) : String(v.v);
    if(isInt(v)) return String(v);
    if(isStr(v)) return "'" + v + "'";
    if(Array.isArray(v)) return "[" + v.map(repr).join(", ") + "]";
    if(v instanceof PyTuple) return "(" + v.a.map(repr).join(", ") + (v.a.length===1?",":"") + ")";
    if(v instanceof Set) return v.size ? "{" + [...v].map(repr).join(", ") + "}" : "set()";
    if(v instanceof Map) return "{" + [...v].map(([k,val])=>repr(k)+": "+repr(val)).join(", ") + "}";
    if(v instanceof PyFunc) return "<function " + v.name + ">";
    return String(v);
  }
  function str(v){
    if(isStr(v)) return v;
    return repr(v);
  }
  function truthy(v){
    if(v === null || v === false) return false;
    if(v === true) return true;
    if(isNum(v)) return num(v) !== 0;
    if(isStr(v)) return v.length > 0;
    if(Array.isArray(v)) return v.length > 0;
    if(v instanceof Map || v instanceof Set) return v.size > 0;
    if(v instanceof PyTuple) return v.a.length > 0;
    return true;
  }
  function eqVal(a,b){
    if(isNum(a) && isNum(b)) return num(a) === num(b);
    if(Array.isArray(a) && Array.isArray(b))
      return a.length===b.length && a.every((x,i)=>eqVal(x,b[i]));
    return a === b;
  }

  /* ---------------- lexer ---------------- */
  const KEYWORDS = new Set(["if","elif","else","for","while","def","return","in","not","and","or",
    "True","False","None","break","continue","pass","import","from","with","as","try","except",
    "finally","raise","is","del","lambda","global"]);

  function lex(src){
    const toks = [];
    const linesArr = src.replace(/\r/g,"").split("\n");
    const stack = [0];
    let paren = 0;
    for(let ln=0; ln<linesArr.length; ln++){
      let line = linesArr[ln];
      const stripped = line.replace(/#.*$/,"");
      if(!stripped.trim()){ continue; }
      let indent = 0;
      while(indent < stripped.length && stripped[indent]===" ") indent++;
      if(stripped[indent]==="\t") err("IndentationError","tabs are not supported here — use spaces");
      const body = stripped.slice(indent);
      if(paren === 0){
        if(indent > stack[stack.length-1]){ stack.push(indent); toks.push({t:"INDENT", ln}); }
        else while(indent < stack[stack.length-1]){ stack.pop(); toks.push({t:"DEDENT", ln}); }
        if(indent !== stack[stack.length-1] && indent > stack[stack.length-1])
          err("IndentationError","unexpected indent on line "+(ln+1));
      }
      let i = 0;
      while(i < body.length){
        const c = body[i];
        if(c===" "){ i++; continue; }
        // strings, including f-strings
        const fpre = (c==="f"||c==="F") && (body[i+1]==='"'||body[i+1]==="'");
        if(c==='"'||c==="'"||fpre){
          const start = fpre ? i+1 : i;
          const q = body[start];
          let j = start+1, s = "";
          while(j < body.length && body[j]!==q){
            if(body[j]==="\\" && j+1<body.length){
              const n = body[j+1];
              s += n==="n" ? "\n" : n==="t" ? "\t" : n;
              j += 2; continue;
            }
            s += body[j++];
          }
          if(j >= body.length) err("SyntaxError","unterminated string literal on line "+(ln+1));
          toks.push({t: fpre?"FSTR":"STR", v:s, ln});
          i = j+1; continue;
        }
        if(/[0-9]/.test(c)){
          let j=i, s="";
          while(j<body.length && /[0-9._]/.test(body[j])) s += body[j++];
          s = s.replace(/_/g,"");
          toks.push({t:"NUM", v: s.includes(".") ? new PyFloat(parseFloat(s)) : parseInt(s,10), ln});
          i = j; continue;
        }
        if(/[A-Za-z_]/.test(c)){
          let j=i, s="";
          while(j<body.length && /[A-Za-z0-9_]/.test(body[j])) s += body[j++];
          toks.push({t: KEYWORDS.has(s)?"KW":"NAME", v:s, ln});
          i = j; continue;
        }
        const three = body.slice(i,i+3), two = body.slice(i,i+2);
        if(["//=","**="].includes(three)){ toks.push({t:"OP", v:three, ln}); i+=3; continue; }
        if(["==","!=","<=",">=","//","**","+=","-=","*=","/="].includes(two)){
          toks.push({t:"OP", v:two, ln}); i+=2; continue; }
        if("+-*/%<>=(),:[]{}.".includes(c)){
          if("([{".includes(c)) paren++;
          if(")]}".includes(c)) paren--;
          toks.push({t:"OP", v:c, ln}); i++; continue;
        }
        err("SyntaxError","unexpected character '"+c+"' on line "+(ln+1));
      }
      if(paren===0) toks.push({t:"NL", ln});
    }
    while(stack.length>1){ stack.pop(); toks.push({t:"DEDENT", ln:linesArr.length}); }
    toks.push({t:"EOF", ln:linesArr.length});
    return toks;
  }

  /* ---------------- parser ---------------- */
  function parse(toks){
    let p = 0;
    const peek = (k=0) => toks[p+k];
    const at = (t,v) => peek().t===t && (v===undefined || peek().v===v);
    const eat = (t,v) => { if(!at(t,v)) err("SyntaxError","expected "+(v||t)+" but found '"+
      (peek().v!==undefined?peek().v:peek().t)+"' on line "+(peek().ln+1)); return toks[p++]; };
    const opt = (t,v) => at(t,v) ? (p++, true) : false;

    function block(){
      // either an inline statement after ':' or an indented suite
      if(at("NL")){
        eat("NL"); eat("INDENT");
        const body = [];
        while(!at("DEDENT") && !at("EOF")) body.push(statement());
        opt("DEDENT");
        return body;
      }
      return [statement()];
    }

    function statement(){
      while(at("NL")) p++;
      const tk = peek();
      if(tk.t==="KW"){
        switch(tk.v){
          case "if": {
            p++; const test = expr(); eat("OP",":");
            const then = block();
            const clauses = [{test, body:then}];
            let orelse = [];
            while(at("KW","elif")){ p++; const t2 = expr(); eat("OP",":"); clauses.push({test:t2, body:block()}); }
            if(at("KW","else")){ p++; eat("OP",":"); orelse = block(); }
            return {k:"if", clauses, orelse};
          }
          case "while": { p++; const test = expr(); eat("OP",":"); return {k:"while", test, body:block()}; }
          case "for": {
            p++; const names = [eat("NAME").v];
            while(opt("OP",",")) names.push(eat("NAME").v);
            eat("KW","in"); const iter = expr(); eat("OP",":");
            return {k:"for", names, iter, body:block()};
          }
          case "def": {
            p++; const name = eat("NAME").v; eat("OP","(");
            const params = [], defaults = {};
            while(!at("OP",")")){
              const pn = eat("NAME").v;
              if(opt("OP","=")) defaults[pn] = expr();
              params.push(pn);
              if(!opt("OP",",")) break;
            }
            eat("OP",")"); eat("OP",":");
            return {k:"def", name, params, defaults, body:block()};
          }
          case "return": { p++; const v = (at("NL")||at("EOF")) ? null : expr(); opt("NL"); return {k:"return", v}; }
          case "break": p++; opt("NL"); return {k:"break"};
          case "continue": p++; opt("NL"); return {k:"continue"};
          case "pass": p++; opt("NL"); return {k:"pass"};
          case "import": case "from": { while(!at("NL")&&!at("EOF")) p++; opt("NL"); return {k:"pass"}; }
          case "with": {
            p++; const ctx = expr(); eat("KW","as"); const name = eat("NAME").v; eat("OP",":");
            return {k:"with", ctx, name, body:block()};
          }
          case "try": {
            p++; eat("OP",":"); const body = block();
            const handlers = [];
            while(at("KW","except")){
              p++;
              let type = null, alias = null;
              if(!at("OP",":")){ type = eat("NAME").v; if(opt("KW","as")) alias = eat("NAME").v; }
              eat("OP",":");
              handlers.push({type, alias, body:block()});
            }
            let orelse = [];
            if(at("KW","finally")){ p++; eat("OP",":"); orelse = block(); }
            return {k:"try", body, handlers, final:orelse};
          }
          case "raise": {
            p++; const e = (at("NL")||at("EOF")) ? null : expr(); opt("NL"); return {k:"raise", e};
          }
        }
      }
      // assignment or bare expression
      const start = p;
      const target = expr();
      if(at("OP","=")){
        p++; const value = expr(); opt("NL");
        return {k:"assign", target, value};
      }
      const aug = ["+=","-=","*=","/=","//=","**="].find(o => at("OP",o));
      if(aug){ p++; const value = expr(); opt("NL"); return {k:"aug", target, op:aug.slice(0,-1), value}; }
      opt("NL");
      return {k:"expr", e:target};
    }

    /* expression precedence, loosest first */
    function expr(){ return orExpr(); }
    function orExpr(){ let l = andExpr();
      while(at("KW","or")){ p++; l = {k:"or", l, r:andExpr()}; } return l; }
    function andExpr(){ let l = notExpr();
      while(at("KW","and")){ p++; l = {k:"and", l, r:notExpr()}; } return l; }
    function notExpr(){ if(at("KW","not")){ p++; return {k:"not", e:notExpr()}; } return compare(); }
    function compare(){
      let l = arith();
      for(;;){
        let op = null;
        if(at("OP","==")||at("OP","!=")||at("OP","<")||at("OP",">")||at("OP","<=")||at("OP",">=")) op = eat("OP").v;
        else if(at("KW","in")){ p++; op = "in"; }
        else if(at("KW","not") && peek(1).t==="KW" && peek(1).v==="in"){ p+=2; op = "not in"; }
        else if(at("KW","is")){ p++; if(at("KW","not")){ p++; op = "is not"; } else op = "is"; }
        else break;
        l = {k:"cmp", op, l, r:arith()};
      }
      return l;
    }
    function arith(){ let l = term();
      while(at("OP","+")||at("OP","-")){ const op = eat("OP").v; l = {k:"bin", op, l, r:term()}; } return l; }
    function term(){ let l = unary();
      while(at("OP","*")||at("OP","/")||at("OP","//")||at("OP","%")){ const op = eat("OP").v; l = {k:"bin", op, l, r:unary()}; }
      return l; }
    function unary(){ if(at("OP","-")){ p++; return {k:"neg", e:unary()}; }
      if(at("OP","+")){ p++; return unary(); } return power(); }
    function power(){ const b = postfix();
      if(at("OP","**")){ p++; return {k:"bin", op:"**", l:b, r:unary()}; } return b; }

    function postfix(){
      let e = atom();
      for(;;){
        if(at("OP","(")){
          p++; const args = [];
          while(!at("OP",")")){ args.push(expr()); if(!opt("OP",",")) break; }
          eat("OP",")");
          e = {k:"call", fn:e, args};
        } else if(at("OP","[")){
          p++;
          let lo = at("OP",":") ? null : expr();
          if(opt("OP",":")){
            const hi = at("OP","]") ? null : expr();
            eat("OP","]");
            e = {k:"slice", obj:e, lo, hi};
          } else { eat("OP","]"); e = {k:"index", obj:e, i:lo}; }
        } else if(at("OP",".")){
          p++; const name = eat("NAME").v;
          e = {k:"attr", obj:e, name};
        } else break;
      }
      return e;
    }

    function atom(){
      const tk = peek();
      if(tk.t==="NUM"){ p++; return {k:"const", v:tk.v}; }
      if(tk.t==="STR"){ p++; return {k:"const", v:tk.v}; }
      if(tk.t==="FSTR"){ p++; return {k:"fstr", v:tk.v}; }
      if(tk.t==="NAME"){ p++; return {k:"name", v:tk.v}; }
      if(tk.t==="KW"){
        if(tk.v==="True"){ p++; return {k:"const", v:true}; }
        if(tk.v==="False"){ p++; return {k:"const", v:false}; }
        if(tk.v==="None"){ p++; return {k:"const", v:null}; }
        if(tk.v==="not"){ return notExpr(); }
      }
      if(at("OP","(")){
        p++;
        if(at("OP",")")){ p++; return {k:"tuple", items:[]}; }
        const first = expr();
        if(at("OP",",")){
          const items = [first];
          while(opt("OP",",")){ if(at("OP",")")) break; items.push(expr()); }
          eat("OP",")"); return {k:"tuple", items};
        }
        eat("OP",")"); return first;
      }
      if(at("OP","[")){
        p++; const items = [];
        while(!at("OP","]")){ items.push(expr()); if(!opt("OP",",")) break; }
        eat("OP","]"); return {k:"list", items};
      }
      if(at("OP","{")){
        p++;
        const pairs = [], items = [];
        let isDict = null;
        while(!at("OP","}")){
          const kx = expr();
          if(opt("OP",":")){ isDict = true; pairs.push([kx, expr()]); }
          else { isDict = isDict===null ? false : isDict; items.push(kx); }
          if(!opt("OP",",")) break;
        }
        eat("OP","}");
        return isDict === false ? {k:"set", items} : {k:"dict", pairs};
      }
      err("SyntaxError","unexpected '"+(tk.v!==undefined?tk.v:tk.t)+"' on line "+(tk.ln+1));
    }

    const prog = [];
    while(!at("EOF")){ if(at("NL")||at("INDENT")||at("DEDENT")){ p++; continue; } prog.push(statement()); }
    return prog;
  }

  /* ---------------- evaluator ---------------- */
  const BREAK = {sig:"break"}, CONT = {sig:"continue"};
  class Ret { constructor(v){ this.v = v; } }

  function run(src, opts){
    const out = [];
    const stdin = (opts && opts.stdin ? opts.stdin.split("\n") : []);
    let stdinPos = 0;
    const globals = new Map();

    const write = s => {
      out.push(s);
      if(out.join("").length > 200000) err("RuntimeError","too much output — is a loop not terminating?");
    };

    /* ---- builtins ---- */
    const BUILTINS = {
      print: (args, kw) => {
        const sep = kw && kw.sep !== undefined ? kw.sep : " ";
        write(args.map(str).join(sep) + ((kw && kw.end !== undefined) ? kw.end : "\n"));
        return null;
      },
      len: a => {
        const v = a[0];
        if(isStr(v)) return v.length;
        if(Array.isArray(v)) return v.length;
        if(v instanceof Map || v instanceof Set) return v.size;
        if(v instanceof PyTuple) return v.a.length;
        err("TypeError","object of type '"+typeName(v)+"' has no len()");
      },
      int: a => {
        const v = a[0];
        if(v === undefined) return 0;
        if(isStr(v)){
          const t = v.trim();
          if(!/^[+-]?\d+$/.test(t)) err("ValueError","invalid literal for int() with base 10: '"+v+"'");
          return parseInt(t,10);
        }
        if(isFloat(v)) return Math.trunc(v.v);
        if(typeof v === "boolean") return v?1:0;
        if(isInt(v)) return v;
        err("TypeError","int() argument must be a string or a number, not '"+typeName(v)+"'");
      },
      float: a => {
        const v = a[0];
        if(isStr(v)){ const n = parseFloat(v); if(isNaN(n)) err("ValueError","could not convert string to float: '"+v+"'"); return new PyFloat(n); }
        return new PyFloat(num(v));
      },
      str: a => a.length ? str(a[0]) : "",
      bool: a => truthy(a[0]),
      type: a => ({__type: typeName(a[0])}),
      list: a => { const v = a[0];
        if(v === undefined) return [];
        if(Array.isArray(v)) return v.slice();
        if(isStr(v)) return v.split("");
        if(v instanceof Set) return [...v];
        if(v instanceof Map) return [...v.keys()];
        if(v instanceof PyTuple) return v.a.slice();
        err("TypeError","'"+typeName(v)+"' object is not iterable"); },
      set: a => { const v = a[0];
        if(v === undefined) return new Set();
        return new Set(BUILTINS.list([v])); },
      dict: a => a[0] instanceof Map ? new Map(a[0]) : new Map(),
      tuple: a => new PyTuple(BUILTINS.list(a)),
      range: a => {
        const [x,y,z] = a.map(num);
        const start = y===undefined ? 0 : x, stop = y===undefined ? x : y, step = z===undefined ? 1 : z;
        const r = [];
        if(step === 0) err("ValueError","range() arg 3 must not be zero");
        for(let i=start; step>0 ? i<stop : i>stop; i+=step){ r.push(i);
          if(r.length > 100000) err("RuntimeError","range too large"); }
        return r;
      },
      sum: a => { const l = BUILTINS.list([a[0]]);
        let anyF = false, t = 0;
        for(const x of l){ if(!isNum(x)) err("TypeError","unsupported operand type(s) for +: 'int' and '"+typeName(x)+"'");
          if(isFloat(x)) anyF = true; t += num(x); }
        return anyF ? new PyFloat(t) : t; },
      min: a => { const l = a.length===1 ? BUILTINS.list([a[0]]) : a; return l.reduce((m,x)=> num(x)<num(m)?x:m); },
      max: a => { const l = a.length===1 ? BUILTINS.list([a[0]]) : a; return l.reduce((m,x)=> num(x)>num(m)?x:m); },
      abs: a => isFloat(a[0]) ? new PyFloat(Math.abs(a[0].v)) : Math.abs(a[0]),
      round: a => { const d = a[1]===undefined ? 0 : num(a[1]);
        const r = Math.round(num(a[0]) * Math.pow(10,d)) / Math.pow(10,d);
        return d===0 ? Math.round(num(a[0])) : new PyFloat(r); },
      sorted: a => { const l = BUILTINS.list([a[0]]).slice();
        l.sort((x,y)=> isNum(x)&&isNum(y) ? num(x)-num(y) : String(x)<String(y)?-1:String(x)>String(y)?1:0);
        return l; },
      reversed: a => BUILTINS.list([a[0]]).slice().reverse(),
      enumerate: a => BUILTINS.list([a[0]]).map((v,i)=> new PyTuple([i,v])),
      zip: a => { const ls = a.map(x=>BUILTINS.list([x]));
        const n = Math.min(...ls.map(l=>l.length));
        const r = []; for(let i=0;i<n;i++) r.push(new PyTuple(ls.map(l=>l[i]))); return r; },
      input: a => {
        if(a.length) write(str(a[0]));
        if(stdinPos >= stdin.length) err("EOFError","EOF when reading a line — this lab has no input queued");
        return stdin[stdinPos++];
      },
      open: a => {
        const path = str(a[0]), mode = a[1] ? str(a[1]) : "r";
        const abs = K.abspath(path);
        const r = lookup(abs);
        if(mode.startsWith("r")){
          if(!r.node) err("FileNotFoundError","[Errno 2] No such file or directory: '"+path+"'");
          if(r.node.t === "d") err("IsADirectoryError","[Errno 21] Is a directory: '"+path+"'");
          if(!K.canRead(r.node)) err("PermissionError","[Errno 13] Permission denied: '"+path+"'");
          const f = new PyFile(abs, mode); f.buf = r.node.c; return f;
        }
        const par = lookup(parentOf(abs));
        if(!par.node) err("FileNotFoundError","[Errno 2] No such file or directory: '"+path+"'");
        const ex = par.node.ch[baseOf(abs)];
        const f = new PyFile(abs, mode);
        if(mode.startsWith("a") && ex && ex.t === "f") f.buf = ex.c;
        else if(!ex) par.node.ch[baseOf(abs)] = fnode("", 0o644, vm.user, vm.user);
        else if(mode.startsWith("w")) ex.c = "";
        return f;
      }
    };

    function flushFile(f){
      if(f.mode.startsWith("r")) return;
      const r = lookup(f.path);
      if(r.node && r.node.t === "f") r.node.c = f.buf;
    }

    /* ---- attribute access / methods ---- */
    function getAttr(obj, name){
      if(isStr(obj)){
        const S = {
          upper: () => obj.toUpperCase(), lower: () => obj.toLowerCase(),
          strip: a => a && a[0] ? obj.replace(new RegExp("^["+a[0]+"]+|["+a[0]+"]+$","g"),"") : obj.trim(),
          lstrip: () => obj.replace(/^\s+/,""), rstrip: () => obj.replace(/\s+$/,""),
          split: a => a && a[0] !== undefined ? obj.split(str(a[0])) : obj.trim().split(/\s+/).filter(x=>x!==""),
          replace: a => obj.split(str(a[0])).join(str(a[1])),
          startswith: a => obj.startsWith(str(a[0])), endswith: a => obj.endsWith(str(a[0])),
          find: a => obj.indexOf(str(a[0])), count: a => obj.split(str(a[0])).length-1,
          join: a => BUILTINS.list([a[0]]).map(str).join(obj),
          title: () => obj.replace(/\w\S*/g, w=>w[0].toUpperCase()+w.slice(1).toLowerCase()),
          capitalize: () => obj.charAt(0).toUpperCase()+obj.slice(1).toLowerCase(),
          isdigit: () => /^\d+$/.test(obj), isalpha: () => /^[A-Za-z]+$/.test(obj)
        };
        if(S[name]) return {__method:S[name]};
        err("AttributeError","'str' object has no attribute '"+name+"'");
      }
      if(Array.isArray(obj)){
        const L = {
          append: a => { obj.push(a[0]); return null; },
          insert: a => { obj.splice(num(a[0]),0,a[1]); return null; },
          remove: a => { const i = obj.findIndex(x=>eqVal(x,a[0]));
            if(i<0) err("ValueError","list.remove(x): x not in list"); obj.splice(i,1); return null; },
          pop: a => { if(!obj.length) err("IndexError","pop from empty list");
            return a && a.length ? obj.splice(num(a[0]),1)[0] : obj.pop(); },
          sort: () => { obj.sort((x,y)=> isNum(x)&&isNum(y) ? num(x)-num(y)
            : String(x)<String(y)?-1:String(x)>String(y)?1:0); return null; },
          reverse: () => { obj.reverse(); return null; },
          index: a => { const i = obj.findIndex(x=>eqVal(x,a[0]));
            if(i<0) err("ValueError",repr(a[0])+" is not in list"); return i; },
          count: a => obj.filter(x=>eqVal(x,a[0])).length,
          clear: () => { obj.length = 0; return null; },
          extend: a => { obj.push(...BUILTINS.list([a[0]])); return null; }
        };
        if(L[name]) return {__method:L[name]};
        err("AttributeError","'list' object has no attribute '"+name+"'");
      }
      if(obj instanceof Map){
        const D = {
          get: a => obj.has(a[0]) ? obj.get(a[0]) : (a.length>1 ? a[1] : null),
          keys: () => [...obj.keys()], values: () => [...obj.values()],
          items: () => [...obj].map(([k,v]) => new PyTuple([k,v])),
          pop: a => { if(!obj.has(a[0])){ if(a.length>1) return a[1]; err("KeyError",repr(a[0])); }
            const v = obj.get(a[0]); obj.delete(a[0]); return v; },
          update: a => { for(const [k,v] of a[0]) obj.set(k,v); return null; },
          clear: () => { obj.clear(); return null; }
        };
        if(D[name]) return {__method:D[name]};
        err("AttributeError","'dict' object has no attribute '"+name+"'");
      }
      if(obj instanceof Set){
        const St = {
          add: a => { obj.add(a[0]); return null; },
          remove: a => { if(!obj.has(a[0])) err("KeyError",repr(a[0])); obj.delete(a[0]); return null; },
          discard: a => { obj.delete(a[0]); return null; },
          union: a => new Set([...obj, ...BUILTINS.list([a[0]])]),
          intersection: a => { const o = new Set(BUILTINS.list([a[0]])); return new Set([...obj].filter(x=>o.has(x))); },
          difference: a => { const o = new Set(BUILTINS.list([a[0]])); return new Set([...obj].filter(x=>!o.has(x))); }
        };
        if(St[name]) return {__method:St[name]};
        err("AttributeError","'set' object has no attribute '"+name+"'");
      }
      if(obj instanceof PyFile){
        const F = {
          read: () => obj.buf,
          readlines: () => obj.buf.split("\n").filter((l,i,a)=>!(i===a.length-1&&l==="")).map(l=>l+"\n"),
          readline: () => { const i = obj.buf.indexOf("\n"); const l = i<0?obj.buf:obj.buf.slice(0,i+1);
            obj.buf = i<0?"":obj.buf.slice(i+1); return l; },
          write: a => { const s = str(a[0]); obj.buf += s; flushFile(obj); return s.length; },
          writelines: a => { for(const l of BUILTINS.list([a[0]])) obj.buf += str(l); flushFile(obj); return null; },
          close: () => { flushFile(obj); obj.closed = true; return null; }
        };
        if(F[name]) return {__method:F[name]};
        err("AttributeError","'TextIOWrapper' object has no attribute '"+name+"'");
      }
      if(obj && obj.__type !== undefined && name === "__name__") return obj.__type;
      err("AttributeError","'"+typeName(obj)+"' object has no attribute '"+name+"'");
    }

    function iterate(v){
      if(Array.isArray(v)) return v;
      if(isStr(v)) return v.split("");
      if(v instanceof Set) return [...v];
      if(v instanceof Map) return [...v.keys()];
      if(v instanceof PyTuple) return v.a;
      if(v instanceof PyFile) return v.buf.split("\n").filter((l,i,a)=>!(i===a.length-1&&l==="")).map(l=>l+"\n");
      err("TypeError","'"+typeName(v)+"' object is not iterable");
    }

    function binop(op, a, b){
      if(op === "+"){
        if(isStr(a) && isStr(b)) return a + b;
        if(isStr(a) !== isStr(b) && (isNum(a)||isNum(b)) && (isStr(a)||isStr(b)))
          err("TypeError", isStr(a) ? 'can only concatenate str (not "'+typeName(b)+'") to str'
                                    : "unsupported operand type(s) for +: '"+typeName(a)+"' and '"+typeName(b)+"'");
        if(Array.isArray(a) && Array.isArray(b)) return a.concat(b);
        if(isNum(a) && isNum(b)) return (isFloat(a)||isFloat(b)) ? new PyFloat(num(a)+num(b)) : a+b;
        err("TypeError","unsupported operand type(s) for +: '"+typeName(a)+"' and '"+typeName(b)+"'");
      }
      if(op === "*"){
        if(isStr(a) && isInt(b)) return a.repeat(Math.max(0,b));
        if(isInt(a) && isStr(b)) return b.repeat(Math.max(0,a));
        if(Array.isArray(a) && isInt(b)){ const r=[]; for(let i=0;i<b;i++) r.push(...a); return r; }
      }
      if(!isNum(a) || !isNum(b))
        err("TypeError","unsupported operand type(s) for "+op+": '"+typeName(a)+"' and '"+typeName(b)+"'");
      const x = num(a), y = num(b), anyF = isFloat(a)||isFloat(b);
      switch(op){
        case "-": return anyF ? new PyFloat(x-y) : x-y;
        case "*": return anyF ? new PyFloat(x*y) : x*y;
        case "/": if(y===0) err("ZeroDivisionError","division by zero"); return new PyFloat(x/y);
        case "//": if(y===0) err("ZeroDivisionError","integer division or modulo by zero");
          return anyF ? new PyFloat(Math.floor(x/y)) : Math.floor(x/y);
        case "%": if(y===0) err("ZeroDivisionError","integer division or modulo by zero");
          { const m = ((x%y)+y)%y; return anyF ? new PyFloat(m) : m; }
        case "**": return anyF ? new PyFloat(Math.pow(x,y)) : Math.pow(x,y);
      }
      err("SyntaxError","unknown operator "+op);
    }

    function compareOp(op, a, b){
      if(op === "in" || op === "not in"){
        let found;
        if(isStr(b)) found = b.includes(str(a));
        else if(Array.isArray(b)) found = b.some(x=>eqVal(x,a));
        else if(b instanceof Set) found = b.has(a);
        else if(b instanceof Map) found = b.has(a);
        else if(b instanceof PyTuple) found = b.a.some(x=>eqVal(x,a));
        else err("TypeError","argument of type '"+typeName(b)+"' is not iterable");
        return op === "in" ? found : !found;
      }
      if(op === "is") return a === b || (a===null&&b===null);
      if(op === "is not") return !(a === b || (a===null&&b===null));
      if(op === "==") return eqVal(a,b);
      if(op === "!=") return !eqVal(a,b);
      if(isStr(a) && isStr(b)){
        if(op === "<") return a < b; if(op === ">") return a > b;
        if(op === "<=") return a <= b; return a >= b;
      }
      if(!isNum(a) || !isNum(b))
        err("TypeError","'"+op+"' not supported between instances of '"+typeName(a)+"' and '"+typeName(b)+"'");
      const x = num(a), y = num(b);
      if(op === "<") return x < y; if(op === ">") return x > y;
      if(op === "<=") return x <= y; return x >= y;
    }

    function lookupName(scope, n){
      if(scope.has(n)) return scope.get(n);
      if(globals.has(n)) return globals.get(n);
      if(BUILTINS[n]) return {__builtin:n};
      err("NameError","name '"+n+"' is not defined");
    }

    function evalNode(n, scope){
      switch(n.k){
        case "const": return n.v;
        case "name": return lookupName(scope, n.v);
        case "fstr": {
          return n.v.replace(/\{([^{}]*)\}/g, (m, code) => {
            const spec = code.split(":");
            const exprSrc = spec[0];
            const toks = lex(exprSrc);
            const ast = parse(toks);
            const v = evalNode(ast[0].e !== undefined ? ast[0].e : ast[0].value, scope);
            if(spec[1] && /^\.\d+f$/.test(spec[1])) return num(v).toFixed(parseInt(spec[1].slice(1),10));
            return str(v);
          });
        }
        case "list": return n.items.map(i=>evalNode(i,scope));
        case "tuple": return new PyTuple(n.items.map(i=>evalNode(i,scope)));
        case "set": return new Set(n.items.map(i=>evalNode(i,scope)));
        case "dict": { const m = new Map();
          for(const [k,v] of n.pairs) m.set(evalNode(k,scope), evalNode(v,scope)); return m; }
        case "neg": { const v = evalNode(n.e,scope);
          if(!isNum(v)) err("TypeError","bad operand type for unary -: '"+typeName(v)+"'");
          return isFloat(v) ? new PyFloat(-v.v) : -v; }
        case "not": return !truthy(evalNode(n.e,scope));
        case "and": { const l = evalNode(n.l,scope); return truthy(l) ? evalNode(n.r,scope) : l; }
        case "or": { const l = evalNode(n.l,scope); return truthy(l) ? l : evalNode(n.r,scope); }
        case "bin": return binop(n.op, evalNode(n.l,scope), evalNode(n.r,scope));
        case "cmp": return compareOp(n.op, evalNode(n.l,scope), evalNode(n.r,scope));
        case "attr": return getAttr(evalNode(n.obj,scope), n.name);
        case "index": {
          const o = evalNode(n.obj,scope), i = evalNode(n.i,scope);
          if(o instanceof Map){ if(!o.has(i)) err("KeyError",repr(i)); return o.get(i); }
          if(isStr(o)){ const idx = num(i)<0 ? o.length+num(i) : num(i);
            if(idx<0||idx>=o.length) err("IndexError","string index out of range"); return o[idx]; }
          const arr = Array.isArray(o) ? o : o instanceof PyTuple ? o.a : null;
          if(!arr) err("TypeError","'"+typeName(o)+"' object is not subscriptable");
          const idx = num(i)<0 ? arr.length+num(i) : num(i);
          if(idx<0||idx>=arr.length) err("IndexError","list index out of range");
          return arr[idx];
        }
        case "slice": {
          const o = evalNode(n.obj,scope);
          const seq = isStr(o) ? o : Array.isArray(o) ? o : o instanceof PyTuple ? o.a : null;
          if(seq === null) err("TypeError","'"+typeName(o)+"' object is not subscriptable");
          const L = seq.length;
          let lo = n.lo===null?0:num(evalNode(n.lo,scope)), hi = n.hi===null?L:num(evalNode(n.hi,scope));
          if(lo<0) lo += L; if(hi<0) hi += L;
          return isStr(o) ? o.slice(lo,hi) : seq.slice(lo,hi);
        }
        case "call": {
          const args = n.args.map(a=>evalNode(a,scope));
          const fnNode = n.fn;
          if(fnNode.k === "attr"){
            const m = getAttr(evalNode(fnNode.obj,scope), fnNode.name);
            if(m && m.__method) return m.__method(args);
            err("TypeError","'"+typeName(m)+"' object is not callable");
          }
          const f = evalNode(fnNode, scope);
          if(f && f.__builtin) return BUILTINS[f.__builtin](args);
          if(f instanceof PyFunc) return callFunc(f, args);
          err("TypeError","'"+typeName(f)+"' object is not callable");
        }
      }
      err("SyntaxError","cannot evaluate node "+n.k);
    }

    function callFunc(f, args){
      const local = new Map(f.closure);
      f.params.forEach((pn,i)=>{
        if(i < args.length) local.set(pn, args[i]);
        else if(f.defaults[pn] !== undefined) local.set(pn, evalNode(f.defaults[pn], local));
        else err("TypeError",f.name+"() missing required positional argument: '"+pn+"'");
      });
      if(args.length > f.params.length)
        err("TypeError",f.name+"() takes "+f.params.length+" positional arguments but "+args.length+" were given");
      const r = execBlock(f.body, local);
      return r instanceof Ret ? r.v : null;
    }

    function assign(target, value, scope){
      if(target.k === "name"){ scope.set(target.v, value); return; }
      if(target.k === "index"){
        const o = evalNode(target.obj,scope), i = evalNode(target.i,scope);
        if(o instanceof Map){ o.set(i,value); return; }
        if(Array.isArray(o)){ const idx = num(i)<0 ? o.length+num(i) : num(i);
          if(idx<0||idx>=o.length) err("IndexError","list assignment index out of range");
          o[idx] = value; return; }
        err("TypeError","'"+typeName(o)+"' object does not support item assignment");
      }
      if(target.k === "tuple"){
        const vals = iterate(value);
        target.items.forEach((t,i)=>assign(t, vals[i], scope));
        return;
      }
      err("SyntaxError","cannot assign to this expression");
    }

    let steps = 0;
    function execBlock(body, scope){
      for(const st of body){
        if(++steps > 400000) err("RuntimeError","this program ran too long — check your loop condition");
        const r = execStmt(st, scope);
        if(r) return r;
      }
      return null;
    }

    function execStmt(st, scope){
      switch(st.k){
        case "pass": return null;
        case "expr": evalNode(st.e, scope); return null;
        case "assign": assign(st.target, evalNode(st.value, scope), scope); return null;
        case "aug": {
          const cur = evalNode(st.target, scope);
          assign(st.target, binop(st.op, cur, evalNode(st.value, scope)), scope);
          return null;
        }
        case "if": {
          for(const c of st.clauses)
            if(truthy(evalNode(c.test, scope))) return execBlock(c.body, scope);
          return execBlock(st.orelse, scope);
        }
        case "while": {
          let guard = 0;
          while(truthy(evalNode(st.test, scope))){
            if(++guard > 100000) err("RuntimeError","this while loop did not terminate");
            const r = execBlock(st.body, scope);
            if(r === BREAK) break;
            if(r && r !== CONT) return r;
          }
          return null;
        }
        case "for": {
          for(const item of iterate(evalNode(st.iter, scope))){
            if(st.names.length === 1) scope.set(st.names[0], item);
            else { const vals = iterate(item); st.names.forEach((nm,i)=>scope.set(nm, vals[i])); }
            const r = execBlock(st.body, scope);
            if(r === BREAK) break;
            if(r && r !== CONT) return r;
          }
          return null;
        }
        case "def": scope.set(st.name, new PyFunc(st.name, st.params, st.defaults, st.body, scope)); return null;
        case "return": return new Ret(st.v ? evalNode(st.v, scope) : null);
        case "break": return BREAK;
        case "continue": return CONT;
        case "with": {
          const ctx = evalNode(st.ctx, scope);
          scope.set(st.name, ctx);
          try { return execBlock(st.body, scope); }
          finally { if(ctx instanceof PyFile){ flushFile(ctx); ctx.closed = true; } }
        }
        case "try": {
          try { const r = execBlock(st.body, scope); if(r) return r; }
          catch(e){
            if(!(e instanceof PyErr)) throw e;
            for(const h of st.handlers){
              if(h.type === null || h.type === e.pytype ||
                 (h.type === "Exception") || (h.type === "OSError" && /Error$/.test(e.pytype))){
                if(h.alias) scope.set(h.alias, e.pymsg);
                const r = execBlock(h.body, scope);
                if(r) return r;
                return execBlock(st.final, scope);
              }
            }
            execBlock(st.final, scope);
            throw e;
          }
          return execBlock(st.final, scope);
        }
        case "raise": {
          const v = st.e ? evalNode(st.e, scope) : null;
          if(v && v.__call) err("Exception", str(v));
          err("Exception", v === null ? "" : str(v));
        }
      }
      err("SyntaxError","unknown statement "+st.k);
    }

    try {
      const ast = parse(lex(src));
      execBlock(ast, globals);
      return {out: out.join(""), err:"", code:0};
    } catch(e){
      if(e instanceof PyErr){
        const body = out.join("");
        return {out: body, err: "Traceback (most recent call last):\n  File \"<stdin>\"\n"+
                e.pytype+(e.pymsg?": "+e.pymsg:""), code:1};
      }
      if(e && e.message && /Maximum call stack/.test(e.message))
        return {out: out.join(""), err:"RecursionError: maximum recursion depth exceeded", code:1};
      throw e;
    }
  }

  /* ---- wire python3 into the shell ---- */
  K.C.python3 = (argv, stdin) => {
    const {flags, ops} = K.splitFlags(argv);
    if(flags.has("V") || argv.includes("--version")) return {out:"Python 3.12.4\n", err:"", code:0};
    const ci = argv.indexOf("-c");
    if(ci >= 0) { const r = run(argv[ci+1] || "", {stdin});
      return {out:r.out, err:r.err?r.err+"\n":"", code:r.code}; }
    if(!ops.length) return {out:"", err:"python3: an interactive prompt is not available here — write a .py file and run it\n", code:1};
    const p = ops[0];
    const r = lookup(p);
    if(!r.node) return {out:"", err:"python3: can't open file '"+K.abspath(p)+"': [Errno 2] No such file or directory\n", code:2};
    if(r.node.t === "d") return {out:"", err:"python3: '"+p+"' is a directory\n", code:2};
    const res = run(r.node.c, {stdin});
    return {out:res.out, err:res.err?res.err+"\n":"", code:res.code};
  };
  K.C.python = K.C.python3;
  K.C.pip = () => ({out:"", err:"pip: no network in this trainer — the standard library is all you need here\n", code:1});
  K.py = run;
  return K;
}

/* One lab per lecture. Every task carries a check() that inspects the machine
   afterwards, so a task completes because the student actually did it — not
   because they typed a matching string. */
/* The context every check() receives: the machine plus what has been run in it. */
function makeLabCtx(K, hist){
  const node = p => K.lookup(p).node;
  return {
    K, hist,
    ran:    rx => hist.some(h => rx.test(h.cmd)),
    said:   rx => hist.some(h => rx.test(h.out) || rx.test(h.err||"")),
    exists: p => !!node(p),
    isDir:  p => { const n = node(p); return !!n && n.t === "d"; },
    read:   p => { const n = node(p); return n && n.t === "f" ? n.c : null; },
    mode:   p => { const n = node(p); return n ? n.mode : null; },
    owner:  p => { const n = node(p); return n ? n.owner : null; },
    group:  p => { const n = node(p); return n ? n.group : null; },
    unit:   n => K.vm.units[n],
    git:    () => K.vm.git,
    // run a student's script and hand back its output
    py:     p => { const r = K.run("python3 " + p); return {out: r.out || "", err: r.err || "", code: r.code}; }
  };
}

   "<code>2</code> sets SGID, then rwx for the owner, rwx for the group, r-x for others."],
  ["What does SGID do on a directory?",
   "New files inside inherit the directory's group, which is what keeps a shared project directory shared."],
  ["<code>/opt/legacy-helper</code> is SUID root. Why is that worth investigating?",
   "It runs as root no matter who launches it. An unexplained SUID root binary is a standard privilege-escalation route."]]},

{wk:37, n:4, date:"Thu 10 Sep", title:"Networking, Firewalls, Subnetting, Update policy",
 topics:"Subnät, brandväggsregler, härdning, uppdateringsrutiner",
 brief:"Subnetting is arithmetic you must be able to do without a calculator. Work each answer out on paper, then echo it into the terminal to check yourself.",
 tasks:[
  {q:"How many <b>usable hosts</b> are in <code>192.168.10.0/26</code>? Answer with <code>echo &lt;number&gt;</code>.",
   hint:"64 addresses in the block, minus the network and broadcast addresses.",
   check:c => c.hist.some(h => /^\s*echo\b/.test(h.cmd) && /\b62\b/.test(h.out))},
  {q:"What is the netmask of a <code>/26</code>? Answer with <code>echo &lt;netmask&gt;</code>.",
   hint:"Two bits borrowed from the last octet.",
   check:c => c.hist.some(h => /^\s*echo\b/.test(h.cmd) && /255\.255\.255\.192/.test(h.out))},
  {q:"What is the broadcast address of <code>192.168.10.64/26</code>? Answer with <code>echo &lt;address&gt;</code>.",
   hint:"The block runs from .64 to the last address before the next block starts.",
   check:c => c.hist.some(h => /^\s*echo\b/.test(h.cmd) && /192\.168\.10\.127/.test(h.out))},
  {q:"Read <code>/etc/ssh/sshd_config</code> and confirm root login over SSH is disabled.",
   hint:"grep for the relevant directive rather than reading the whole file.",
   check:c => c.said(/PermitRootLogin no/)},
  {q:"Harden it further: change <code>PasswordAuthentication yes</code> to <code>no</code> in that file.",
   hint:"sed can edit in place with -i, and the file belongs to root.",
   check:c => /PasswordAuthentication no/.test(c.read("/etc/ssh/sshd_config")||"")},
  {q:"List the listening sockets again and note which are bound to <code>0.0.0.0</code> — those are reachable from the network.",
   hint:"The same ss command as last week.",
   check:c => c.said(/0\.0\.0\.0:22/)}],
 check:[
  ["How many usable hosts in a <code>/26</code>, and why not 64?",
   "62. The first address identifies the network and the last is the broadcast address, so neither can be given to a host."],
  ["Why is default-deny inbound the normal firewall stance?",
   "You only have to reason about what you deliberately opened, rather than enumerating everything an attacker might try."],
  ["What is the difference between a service bound to <code>127.0.0.1</code> and one bound to <code>0.0.0.0</code>?",
   "<code>127.0.0.1</code> only accepts connections from the machine itself. <code>0.0.0.0</code> accepts them from any interface — that is what the network can reach."]]},

{wk:38, n:5, date:"Mon 14 Sep", title:"Boot process, systemd, cron, ssh",
 topics:"Uppstart, units, schemalagda jobb, nycklar",
 brief:"systemctl to see state, journalctl to find out why. This pair answers most 'it is broken' questions on a modern system.",
 tasks:[
  {q:"Check whether the <code>sshd</code> service is running.", hint:"The systemd control command plus the obvious sub-command.",
   check:c => c.hist.some(h => /sshd/.test(h.out) && /active \(running\)/.test(h.out))},
  {q:"List the units that have <b>failed</b>.", hint:"list-units with a long option.",
   check:c => c.said(/bluetooth/)},
  {q:"Start the <code>docker</code> service now <b>and</b> make it start at every boot, in one command.",
   hint:"enable handles boot; one option also starts it immediately.",
   check:c => c.unit("docker") && c.unit("docker").enabled && c.unit("docker").state==="running"},
  {q:"nginx will not start. Read its journal and find the line that explains why.",
   hint:"journalctl filtered to one unit.",
   check:c => c.said(/Address already in use/)},
  {q:"Generate an ed25519 SSH key pair.", hint:"The key generator with a type option.",
   check:c => c.exists("/home/analyst/.ssh/id_ed25519.pub")},
  {q:"Set <code>~/.ssh</code> to the mode SSH insists on.", hint:"Full access for you, nothing for anyone else.",
   check:c => c.mode("/home/analyst/.ssh") === 0o700},
  {q:"Schedule <code>/home/analyst/backup.sh</code> to run every day at 02:00. <code>crontab -e</code> opens an editor here.",
   hint:"Five schedule fields then the command: minute hour day month weekday.",
   check:c => /(^|\n)\s*0\s+2\s+\*\s+\*\s+\*\s+\S+backup\.sh/.test(c.read("/var/spool/cron/analyst")||"")}],
 check:[
  ["What is the difference between <code>start</code> and <code>enable</code>?",
   "<code>start</code> runs it now. <code>enable</code> makes it start at boot. <code>enable --now</code> does both — and forgetting this is the classic reason a demo dies after a reboot."],
  ["What is the field order in a crontab line?",
   "minute, hour, day-of-month, month, day-of-week, then the command. Daily at 02:00 is <code>0 2 * * *</code>."],
  ["Which permissions does SSH demand on <code>~/.ssh</code> and a private key?",
   "<code>700</code> on the directory and <code>600</code> on the key, or it refuses to use them."]]},

{wk:38, n:6, date:"Thu 17 Sep", title:"Logs, database, webserver, intro to security",
 topics:"Loggar, tjänster, grundläggande härdning",
 brief:"There is a real attack in this machine's auth log. Find it, count it, and identify where it came from.",
 tasks:[
  {q:"Show the last 20 lines of <code>/var/log/auth.log</code>. It needs root to read.",
   hint:"tail with a line count, behind sudo.",
   check:c => c.hist.some(h => /\btail\b/.test(h.cmd) && /Failed password/.test(h.out))},
  {q:"Count how many failed password attempts the log contains.",
   hint:"grep can count on its own with one option.",
   check:c => c.hist.some(h => /grep/.test(h.cmd) && /^\s*13\s*$/m.test(h.out))},
  {q:"Which single IP address is responsible for most of them? Pull the addresses out and rank them.",
   hint:"grep -o prints only the matching part, so grep the failures, then grep -o an IP pattern, then sort | uniq -c | sort -rn.",
   check:c => c.hist.some(h => /uniq/.test(h.cmd) && /91\.240\.118\.44/.test(h.out))},
  {q:"Start the nginx web server.", hint:"It is currently dead — and starting a service needs root.",
   check:c => c.unit("nginx") && c.unit("nginx").state==="running"},
  {q:"Confirm it answers, fetching only the response headers from <code>localhost</code>.",
   hint:"An uppercase option that means 'head'.",
   check:c => c.said(/HTTP\/1\.1 200 OK/)},
  {q:"Find which process is listening on port 80. You need root to see the process name.",
   hint:"List sockets with sudo and filter for the port.",
   check:c => c.hist.some(h => /\b(ss|netstat|lsof)\b/.test(h.cmd) && /:80\b/.test(h.out) && /nginx/.test(h.out))}],
 check:[
  ["Where do SSH authentication failures land?",
   "<code>/var/log/auth.log</code> on Debian and Ubuntu, <code>/var/log/secure</code> on RHEL. <code>journalctl -u ssh</code> works on systemd too."],
  ["Why must <code>sort</code> come before <code>uniq -c</code>?",
   "<code>uniq</code> only collapses adjacent duplicates. Unsorted input gives you nonsense counts."],
  ["What does <code>curl -I</code> do that plain <code>curl</code> does not?",
   "Sends a HEAD request — status line and headers, no body."]]},

{wk:39, n:7, date:"Mon 21 Sep", title:"Backup, rsync, git, linuxadministration",
 topics:"Säkerhetskopiering, synkronisering, versionshantering",
 brief:"A backup you have never restored is not a backup. Every task here ends with proving the data came back.",
 tasks:[
  {q:"Create a gzip-compressed archive <code>~/backup.tar.gz</code> of the <code>~/projects</code> directory.",
   hint:"create, gzip, file — and f must come last, immediately before the archive name.",
   // the archive must really be gzip: leaving -z out produces a plain tar
   // wearing a .gz name, which is the mistake this task is teaching against
   check:c => { try{ return JSON.parse(c.read("/home/analyst/backup.tar.gz")).fmt === "gzip"; }
               catch(e){ return false; } }},
  {q:"Extract that archive into <code>/tmp</code> and prove the contents came back by reading <code>app.conf</code>.",
   hint:"cd there first, then extract. The compression flag must match the archive.",
   check:c => c.said(/port=8080/) && c.exists("/tmp/projects/webshop/app.conf")},
  {q:"Sync <code>~/projects/</code> to <code>/tmp/bak</code> with rsync in archive mode, verbose.",
   hint:"Create the destination first. -a is archive mode, -v is verbose.",
   check:c => c.exists("/tmp/bak/webshop/app.conf") || c.exists("/tmp/bak/projects/webshop/app.conf")},
  {q:"Compute the SHA-256 checksum of your archive.", hint:"The algorithm name plus 'sum'.",
   check:c => c.hist.some(h => /sha256sum/.test(h.cmd) && /[0-9a-f]{64}/.test(h.out))},
  {q:"Turn <code>~/projects</code> into a git repository, stage everything, and make a first commit.",
   hint:"Three commands: init, add, commit with a message.",
   check:c => c.git() && c.git().commits.length >= 1},
  {q:"Show the history, one line per commit.", hint:"log with a long option.",
   check:c => c.hist.some(h => /git\s+log/.test(h.cmd) && /--oneline/.test(h.cmd) &&
     h.code===0 && /^\w+\s+\S/m.test(h.out))}],
 check:[
  ["Why run <code>rsync --delete</code> with <code>--dry-run</code> first?",
   "<code>--delete</code> removes anything on the destination missing from the source. One wrong source path empties the backup."],
  ["What does <code>-a</code> give you in <code>rsync -av</code>?",
   "Archive mode: recursive, preserving permissions, ownership, timestamps and symlinks."],
  ["What is the difference between <code>git add</code> and <code>git commit</code>?",
   "<code>add</code> stages what you want included; <code>commit</code> records the staged set as a snapshot with a message."]]},

{wk:39, n:8, date:"Thu 24 Sep", title:"Datacenter, moln, hybrid — on-prem och cloudlösningar",
 topics:"Driftsformer, ansvarsfördelning, kostnad",
 brief:"A written week. Use the terminal as your notebook: write the answers to files, which is also good practice with redirection.",
 tasks:[
  {q:"Create <code>~/cloud/ansvar.txt</code> with four lines — on-prem, IaaS, PaaS, SaaS — each naming who manages the operating system.",
   hint:"mkdir the directory, then use echo with >> to append a line at a time.",
   check:c => { const t = c.read("/home/analyst/cloud/ansvar.txt")||"";
     return /iaas/i.test(t) && /paas/i.test(t) && /saas/i.test(t) && t.trim().split("\n").length >= 4; }},
  {q:"Create <code>~/cloud/workloads.txt</code> listing three workloads from your project, each line ending in <code>on-prem</code> or <code>cloud</code>.",
   hint:"Three lines, appended one at a time.",
   check:c => { const t = c.read("/home/analyst/cloud/workloads.txt")||"";
     const ls = t.trim().split("\n").filter(Boolean);
     return ls.length >= 3 && ls.filter(l=>/on-?prem|cloud/i.test(l)).length >= 3; }},
  {q:"Add a line to <code>~/cloud/rto.txt</code> defining an RTO and an RPO for one service, in concrete numbers.",
   hint:"Something like: webshop RTO 4h RPO 24h.",
   check:c => { const t = c.read("/home/analyst/cloud/rto.txt")||"";
     return /rto/i.test(t) && /rpo/i.test(t) && /\d/.test(t); }},
  {q:"Read your three files back in one command to check them over.",
   hint:"cat accepts more than one filename, and a glob saves typing.",
   check:c => c.hist.some(h => /^\s*cat\b/.test(h.cmd) && /rto/i.test(h.out) && /iaas/i.test(h.out))}],
 check:[
  ["Under IaaS, who patches the operating system?",
   "You do. The provider stops at the virtual hardware. Under PaaS they take the OS and runtime as well."],
  ["What is the difference between RTO and RPO?",
   "RTO is how long you may take to come back. RPO is how much data you may lose — which is a statement about backup frequency."],
  ["Name one cloud cost people forget.",
   "Egress. Data in is usually free; data out, or between regions, is billed."]]},

   check:c => c.hist.some(h => /uniq/.test(h.cmd) && /200/.test(h.out) && /404/.test(h.out))},
  {q:"Set <code>~/reports</code> so that only you can enter or read it.",
   hint:"Numeric mode: everything for the owner, nothing for anyone else.",
   check:c => c.mode("/home/analyst/reports") === 0o700},
  {q:"Save the output of <code>ls -la /etc</code> into <code>~/etc-listing.txt</code>, then confirm how many lines it has.",
   hint:"Redirect with >, then wc -l the file.",
   check:c => c.exists("/home/analyst/etc-listing.txt") &&
     c.hist.some(h => /wc\s+-l/.test(h.cmd) && /etc-listing/.test(h.cmd))},
  {q:"Write <code>~/py/sammanfatta.py</code> that reads <code>/var/log/access.log</code> and prints how many lines it contains.",
   hint:"Open the file, loop, count. Or read it and count the lines in the result.",
   check:c => { const r = c.py("/home/analyst/py/sammanfatta.py");
     return /40/.test(r.out); }}],
 check:[
  ["What is the best use of your last few days?",
   "Retrieval practice, not re-reading. Close the notes and try to produce the command — that is what the exam asks for."],
  ["Which topics carry the most weight across this course?",
   "Permissions, systemd, the networking basics and the pipes-and-redirection toolkit. They reappear in every later week, including the Python file handling."]]}
]; }

/* =================== course plan tab ===================
   A lab per lecture, worked on a simulated machine that lives in the page.
   Task completion is checked against machine state and persists; the machine
   itself resets on reload, which is what you want when practising. */
const COURSE = buildCourse();
const CS = {K:null, lec:-1, hist:[], hp:0, editing:null};
const ckey = (li, ti) => "L" + COURSE[li].n + ":" + ti;
const lecDone = li => COURSE[li].tasks.filter((_,ti)=>S.lab[ckey(li,ti)]).length;

function bootMachine(){
  CS.K = attachPython(seedVM(attachShell(makeVM())));
  CS.hist = []; CS.hp = 0;
}

function cline(html, cls){
  const d = document.createElement("div");
  d.className = "ln " + (cls||"");
  d.innerHTML = html;
  const s = $("c-screen");
  s.appendChild(d); s.scrollTop = s.scrollHeight;
}
function cps1(){
  const p = CS.K.vm.cwd.replace(CS.K.vm.HOME, "~");
  return '<span class="h">analyst@'+CS.K.vm.host+'</span>:<span class="path">'+esc(p)+'</span>$';
}
function cprompt(){ $("c-ps1").innerHTML = cps1(); }

/* run everything the current lecture asks for and tick off what is now true */
function recheck(){
  const lec = COURSE[CS.lec];
  const ctx = makeLabCtx(CS.K, CS.hist);
  const newly = [];
  lec.tasks.forEach((t,ti)=>{
    if(S.lab[ckey(CS.lec,ti)]) return;
    let done = false;
    try{ done = !!t.check(ctx); }catch(e){ done = false; }
    if(done){ S.lab[ckey(CS.lec,ti)] = 1; newly.push(ti); }
  });
  if(newly.length){ save(); paintTasks(); }
  return newly;
}

function paintTasks(){
  const lec = COURSE[CS.lec];
  lec.tasks.forEach((t,ti)=>{
    const el = $("t"+ti);
    if(!el) return;
    const done = !!S.lab[ckey(CS.lec,ti)];
    el.className = "ltask" + (done ? " done" : "");
    el.querySelector(".lstat").textContent = done ? "done" : "";
  });
  const n = lecDone(CS.lec), tot = lec.tasks.length;
  const bar = $("c-progress");
  if(bar){
    bar.innerHTML = '<b>'+n+"</b> / "+tot+" tasks" +
      (n===tot ? ' &nbsp;<span class="allgood">lab complete</span>' : "");
  }
  renderCourseNav();
}

async function csubmit(raw){
  const input = String(raw).trim();
  if(!input) return;
  CS.hist.push({cmd:input, out:"", err:"", code:0});
  CS.hp = CS.hist.length;
  cline(cps1()+" "+esc(input), "cmd");

  if(/^(tasks|lab)$/i.test(input)){
    CS.hist.pop();
    COURSE[CS.lec].tasks.forEach((t,ti)=>
      cline((S.lab[ckey(CS.lec,ti)] ? "[x] " : "[ ] ") + esc(t.q.replace(/<[^>]+>/g,"")), "note"));
    return;
  }
  if(/^reset$/i.test(input)){
    CS.hist.pop(); bootMachine();
    $("c-screen").innerHTML = "";
    cline("machine reset — your completed tasks are kept", "note");
    cprompt(); return;
  }

  let r;
  try{ r = CS.K.run(input); }
  catch(e){ r = {out:"", err:"internal error: "+e.message+"\n", code:1}; }

  const rec = CS.hist[CS.hist.length-1];
  rec.out = r.out || ""; rec.err = r.err || ""; rec.code = r.code;

  if(r.clear) $("c-screen").innerHTML = "";
  if(r.out) r.out.replace(/\n$/,"").split("\n").forEach(l => cline(esc(l) || "&nbsp;"));
  if(r.err) r.err.replace(/\n$/,"").split("\n").forEach(l => cline(esc(l), "err"));
  if(r.editor) openEditor(r.editor);

  cprompt();
  const newly = recheck();
  newly.forEach(ti => cline("task "+(ti+1)+" complete — "+
    esc(COURSE[CS.lec].tasks[ti].q.replace(/<[^>]+>/g,"").slice(0,68)), "ok"));
}

/* ---------- the editor pane, for writing scripts and crontabs ---------- */
function openEditor(path){
  CS.editing = path;
  const node = CS.K.lookup(path).node;
  $("ed-path").textContent = path;
  $("ed-body").value = node && node.t === "f" ? node.c : "";
  $("c-editor").style.display = "";
  setTimeout(()=>$("ed-body").focus(), 30);
}
function closeEditor(saveIt){
  if(saveIt && CS.editing){
    const node = CS.K.lookup(CS.editing).node;
    if(node && node.t === "f") node.c = $("ed-body").value;
    cline("saved "+esc(CS.editing), "note");
    recheck();
  }
  $("c-editor").style.display = "none";
  CS.editing = null;
  $("c-entry").focus();
}

function renderCourseNav(){
  const box = $("modlist"); box.innerHTML = "";
  COURSE.forEach((s,i)=>{
    const b = document.createElement("button");
    b.className = "mod"; b.setAttribute("aria-current", i===CS.lec);
    b.innerHTML = '<span class="n">v'+s.wk+'</span><span>F'+s.n+": "+esc(s.title)+'</span>'+
      '<span class="done">'+lecDone(i)+"/"+s.tasks.length+"</span>";
    b.onclick = ()=>{ S.c = i; renderCourse(); save(); };
    box.appendChild(b);
  });
  const tot = COURSE.reduce((n,s)=>n+s.tasks.length,0);
  const dn  = COURSE.reduce((n,s,i)=>n+lecDone(i),0);
  $("s-solved").textContent = dn;
  $("s-acc").textContent = Math.round(dn/tot*100)+"%";
  $("s-streak").textContent = "—";
}

function renderCourse(){
  const li = Math.min(S.c|0, COURSE.length-1);
  const lec = COURSE[li];
  if(CS.lec !== li){ CS.lec = li; bootMachine(); }

  let h =
    '<div class="cw"><div class="chead">'+
      '<div class="cmeta"><span class="wk">Vecka '+lec.wk+'</span>'+
        '<span class="dt">'+esc(lec.date)+'</span><span>Föreläsning '+lec.n+'</span></div>'+
      "<h1>"+esc(lec.title)+"</h1>"+
      '<p class="topics">'+esc(lec.topics)+"</p>"+
      '<p class="cbrief">'+esc(lec.brief)+"</p>"+
    "</div>"+
    '<div class="csec"><h2>Lab — the terminal below is a real simulated machine</h2>'+
      '<ol class="ltasks">';
  lec.tasks.forEach((t,ti)=>{
    const done = !!S.lab[ckey(li,ti)];
    h += '<li class="ltask'+(done?" done":"")+'" id="t'+ti+'">'+
      '<span class="lnum">'+(ti+1)+"</span>"+
      '<span class="lbody"><span class="ltext">'+t.q+"</span>"+
        '<button class="lhint" data-h="'+ti+'">hint</button>'+
        '<span class="lhinttext" id="h'+ti+'" hidden>'+esc(t.hint)+"</span></span>"+
      '<span class="lstat">'+(done?"done":"")+"</span></li>";
  });
  h += "</ol>"+
    '<p class="cprog" id="c-progress"></p>'+
    "</div>"+
    '<div class="csec"><h2>Check yourself — answers are hidden until you open them</h2>';
  lec.check.forEach(([q,a])=>{
    h += '<details class="chk"><summary>'+q+'</summary><div class="ans">'+a+"</div></details>";
  });
  h += "</div></div>";

  h += '<section class="term labterm">'+
    '<div class="bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>'+
      '<span class="title">bash — analyst@workstation-07 (simulated)</span>'+
      '<button class="tbtn" id="c-reset">reset machine</button></div>'+
    '<div class="screen" id="c-screen"></div>'+
    '<div class="inputline"><span class="ps1" id="c-ps1"></span>'+
      '<input id="c-entry" autocomplete="off" autocapitalize="off" spellcheck="false" '+
      'aria-label="Type a command" placeholder="type a command — try: ls, help, tasks"></div>'+
    '<div class="editor" id="c-editor" style="display:none">'+
      '<div class="edhead">editing <b id="ed-path"></b>'+
        '<span class="edhint">Ctrl+Enter saves</span></div>'+
      '<textarea id="ed-body" spellcheck="false"></textarea>'+
      '<div class="edfoot"><button class="nextbtn" id="ed-save">Save</button>'+
        '<button class="tbtn" id="ed-cancel">Cancel</button></div>'+
    "</div>"+
    "</section>";

  h += '<div class="cnav">'+
    '<button class="tbtn" id="c-prev">← Previous</button>'+
    '<button class="nextbtn" id="c-next">Next lecture →</button></div>';

  $("courseview").innerHTML = h;

  $("c-screen").innerHTML = "";
  cline("Simulated Arch machine. Your home is /home/analyst. Nothing here can break anything.", "note");
  cline("Type <b>help</b> for the command list, <b>tasks</b> to re-read the lab, <b>reset</b> to start the machine over.", "note");
  cprompt();

  $("c-entry").addEventListener("keydown", e=>{
    if(e.key==="Enter"){ const v=e.target.value; e.target.value=""; csubmit(v); }
    else if(e.key==="ArrowUp"){ e.preventDefault();
      if(CS.hp>0){ CS.hp--; e.target.value = CS.hist[CS.hp] ? CS.hist[CS.hp].cmd : ""; } }
    else if(e.key==="ArrowDown"){ e.preventDefault();
      if(CS.hp < CS.hist.length-1){ CS.hp++; e.target.value = CS.hist[CS.hp].cmd; }
      else { CS.hp = CS.hist.length; e.target.value=""; } }
  });
  $("c-screen").addEventListener("click", ()=>$("c-entry").focus());
  $("c-reset").onclick = ()=>csubmit("reset");
  $("ed-save").onclick = ()=>closeEditor(true);
  $("ed-cancel").onclick = ()=>closeEditor(false);
  $("ed-body").addEventListener("keydown", e=>{
    if(e.key==="Enter" && (e.ctrlKey||e.metaKey)){ e.preventDefault(); closeEditor(true); }
    if(e.key==="Escape"){ e.preventDefault(); closeEditor(false); }
    if(e.key==="Tab"){ e.preventDefault();
      const t = e.target, s = t.selectionStart;
      t.value = t.value.slice(0,s) + "    " + t.value.slice(t.selectionEnd);
      t.selectionStart = t.selectionEnd = s + 4; }
  });
  $("courseview").querySelectorAll(".lhint").forEach(b=>{
    b.onclick = ()=>{ const el = $("h"+b.dataset.h);
      el.hidden = !el.hidden; b.textContent = el.hidden ? "hint" : "hide hint"; };
  });
  $("c-prev").onclick = ()=>{ if(S.c>0){ S.c--; renderCourse(); save(); } };
  $("c-next").onclick = ()=>{ if(S.c<COURSE.length-1){ S.c++; renderCourse(); save(); } };
  [["c-prev", li===0], ["c-next", li===COURSE.length-1]].forEach(([id,off])=>{
    $(id).disabled = off; $(id).style.opacity = off ? ".4" : "1";
  });

  paintTasks();
}

/* ===== END simulated machine ===== */





/* ---------- quiz state & rendering ---------- */
const Q = {tier:0, i:0, picked:new Set(), checked:false};
const qKey = () => Q.tier + ":" + Q.i;
const qItem = () => QUIZ[Q.tier].items[Q.i];

function renderQuizNav(){
  const box = $("modlist"); box.innerHTML = "";
  QUIZ.forEach((t,i)=>{
    const done = t.items.filter((_,j)=>S.qDone[i+":"+j]).length;
    const b = document.createElement("button");
    b.className="mod"; b.setAttribute("aria-current", i===Q.tier);
    b.innerHTML = '<span class="n">'+String(i+1).padStart(2,"0")+'</span><span>'+t.tier+'</span>'+
      '<span class="done">'+done+"/"+t.items.length+"</span>";
    b.onclick = ()=>{ Q.tier=i; Q.i=0; Q.picked.clear(); Q.checked=false; renderQuiz(); save(); };
    box.appendChild(b);
  });
  $("s-solved").textContent = Object.keys(S.qDone).length;
  $("s-acc").textContent = S.qTries ? Math.round(S.qHits/S.qTries*100)+"%" : "—";
  $("s-streak").textContent = "—";
}
function renderQuiz(){
  const it = qItem(), t = QUIZ[Q.tier];
  $("quizview").innerHTML =
    '<div class="brief"><div class="meta"><span>'+esc(t.tier)+"</span>"+
      '<span class="idx">Question '+(Q.i+1)+" / "+t.items.length+"</span>"+
      "<span>select all that apply</span>"+
      (S.qDone[qKey()] ? '<span style="color:var(--lime)">answered</span>' : "")+
    "</div><h1>"+it.q+"</h1></div>"+
    '<div class="qopts" id="qopts"></div>'+
    '<div class="actions" style="margin-top:16px">'+
      '<button class="nextbtn" id="q-check" style="margin:0">Check answer</button>'+
      '<button class="ghost" id="q-prev">← Previous</button>'+
      '<button class="ghost" id="q-next">Skip →</button>'+
    '</div><div id="qafter"></div>';
  const box = $("qopts");
  it.o.forEach((o,i)=>{
    const b = document.createElement("button");
    b.className = "qopt"; b.type = "button";
    b.innerHTML = '<span class="box" aria-hidden="true"></span><span class="txt">'+o.t+"</span>";
    b.setAttribute("aria-pressed","false");
    b.onclick = ()=>{
      if(Q.checked) return;
      const on = Q.picked.has(i);
      on ? Q.picked.delete(i) : Q.picked.add(i);
      b.classList.toggle("on", !on);
      b.setAttribute("aria-pressed", String(!on));
    };
    box.appendChild(b);
  });
  $("q-check").onclick = checkQuiz;
  $("q-prev").onclick = ()=>quizStep(-1);
  $("q-next").onclick = ()=>quizStep(1);
  renderQuizNav();
}
function checkQuiz(){
  if(Q.checked){ quizStep(1); return; }
  if(!Q.picked.size){
    $("qafter").innerHTML = '<div class="hintbox"><b>Nothing selected</b>Pick at least one option — more than one can be correct.</div>';
    return;
  }
  const it = qItem();
  Q.checked = true;
  let right = true;
  it.o.forEach((o,i)=>{
    const el = $("qopts").children[i];
    const picked = Q.picked.has(i);
    el.classList.remove("on");
    if(o.c && picked) el.classList.add("hit");
    else if(o.c && !picked){ el.classList.add("missed"); right = false; }
    else if(!o.c && picked){ el.classList.add("wrong"); right = false; }
  });
  S.qTries++;
  if(right){ S.qHits++; S.qDone[qKey()] = true; }
  $("qafter").innerHTML = '<div class="breakdown" style="border-top-color:'+(right?"var(--lime)":"var(--rose)")+'">'+
    '<h2 style="color:'+(right?"var(--lime)":"var(--rose)")+'">'+(right?"Correct":"Not quite")+"</h2>"+
    '<div class="tok"><span class="v" style="font-family:var(--sans)">'+it.e+"</span></div>"+
    '<button class="nextbtn" id="q-go">Next question →</button></div>';
  $("q-go").onclick = ()=>quizStep(1);
  $("q-check").style.display = "none";
  renderQuizNav(); save();
}
function quizStep(d){
  const t = QUIZ[Q.tier];
  let i = Q.i + d;
  if(i >= t.items.length){ if(Q.tier < QUIZ.length-1){ Q.tier++; Q.i=0; } else { quizDone(); return; } }
  else if(i < 0){ if(Q.tier>0){ Q.tier--; Q.i = QUIZ[Q.tier].items.length-1; } else return; }
  else Q.i = i;
  Q.picked.clear(); Q.checked = false;
  renderQuiz(); save();
}
function quizDone(){
  const total = QUIZ.reduce((n,t)=>n+t.items.length,0);
  $("quizview").innerHTML = '<div class="breakdown done-card"><h2 style="color:var(--amber)">Quiz complete</h2>'+
    '<div class="big">'+Object.keys(S.qDone).length+" / "+total+"</div>"+
    "<p>answered correctly · "+(S.qTries?Math.round(S.qHits/S.qTries*100):0)+"% accuracy</p>"+
    '<button class="nextbtn" id="q-restart">Start over</button></div>';
  $("q-restart").onclick = ()=>{ Q.tier=0; Q.i=0; Q.picked.clear(); Q.checked=false; renderQuiz(); };
  renderQuizNav();
}

/* ---------- mode switching ---------- */
function setMode(m){
  S.mode = m;
  const drill = m === "drill", quiz = m === "quiz", course = m === "course";
  ["guide","brief","after"].forEach(id=>$(id).style.display = drill ? "" : "none");
  document.querySelector(".term").style.display = drill ? "" : "none";
  $("quizview").style.display = quiz ? "" : "none";
  $("courseview").style.display = course ? "" : "none";
  $("m-drill").setAttribute("aria-pressed", String(drill));
  $("m-quiz").setAttribute("aria-pressed", String(quiz));
  $("m-course").setAttribute("aria-pressed", String(course));
  $("sectlabel").textContent = drill ? "Modules" : quiz ? "Quiz sections" : "Course weeks";
  $("distro").style.opacity = drill ? "1" : ".35";
  if(drill) renderTask(); else if(quiz) renderQuiz(); else renderCourse();
  save();
}

/* =================== boot =================== */
(async function(){
  const seen = await load();
  renderDistro(); renderSheet("");
  $("m-drill").onclick  = ()=>setMode("drill");
  $("m-quiz").onclick   = ()=>setMode("quiz");
  $("m-course").onclick = ()=>setMode("course");
  setMode(S.mode || "drill");
  const tb = document.createElement("button");
  tb.className = "refbtn"; tb.textContent = "Tutorial";
  tb.style.borderColor = "var(--amber)"; tb.style.color = "var(--amber)"; tb.style.marginLeft = "8px";
  tb.onclick = startTour;
  $("openref").after(tb);
  if(!seen) setTimeout(startTour, 400);
})();
